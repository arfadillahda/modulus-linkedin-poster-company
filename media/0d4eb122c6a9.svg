  <text
    x="660"
    y="610"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="38"
    font-weight="800"
    fill="#2D5BFF"
    letter-spacing="-0.02em">05</text>

  <!-- Tile 5 title -->
  <text
    x="660"
    y="650"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="19"
    font-weight="700"
    fill="#111111"
    letter-spacing="-0.01em">Human-Walkable Audit</text>

  <!-- Tile 5 caption line 1 -->
  <text
    x="660"
    y="682"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="13.5"
    font-weight="400"
