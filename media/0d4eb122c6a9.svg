<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <clipPath id="tile1clip">
      <rect x="64" y="262" width="440" height="280" rx="16"/>
    </clipPath>
    <clipPath id="tile2clip">
      <rect x="520" y="262" width="440" height="280" rx="16"/>
    </clipPath>
    <clipPath id="tile3clip">
      <rect x="64" y="558" width="270" height="220" rx="16"/>
    </clipPath>
    <clipPath id="tile4clip">
      <rect x="350" y="558" width="270" height="220" rx="16"/>
    </clipPath>
    <clipPath id="tile5clip">
      <rect x="636" y="558" width="324" height="220" rx="16"/>
