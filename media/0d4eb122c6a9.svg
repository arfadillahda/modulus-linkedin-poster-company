  <!-- Tile 4 caption line 2 -->
  <text
    x="374"
    y="700"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="13.5"
    font-weight="400"
    fill="#3A3A3A">low. Don't hide it.</text>

  <!-- TILE 5 — bottom-right wider -->
  <rect x="636" y="554" width="328" height="220" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>

