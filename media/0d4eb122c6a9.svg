  <!-- Tile 5 caption line 2 -->
  <text
    x="660"
    y="700"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="13.5"
    font-weight="400"
    fill="#3A3A3A">must trace the decision trail.</text>

  <!-- ═══════════════════════════════════════════ -->
  <!-- BOTTOM BAND -->
  <!-- ═══════════════════════════════════════════ -->

  <!-- Hairline rule above closing line -->
  <line x1="64" y1="822" x2="960" y2="822" stroke="#11111130" stroke-width="1"/>

