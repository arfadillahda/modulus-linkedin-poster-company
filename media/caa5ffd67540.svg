<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <clipPath id="tile1clip"><rect x="64" y="254" width="440" height="220" rx="16"/></clipPath>
    <clipPath id="tile2clip"><rect x="520" y="254" width="440" height="220" rx="16"/></clipPath>
    <clipPath id="tile3clip"><rect x="64" y="490" width="272" height="220" rx="16"/></clipPath>
    <clipPath id="tile4clip"><rect x="352" y="490" width="272" height="220" rx="16"/></clipPath>
    <clipPath id="tile5clip"><rect x="640" y="490" width="320" height="220" rx="16"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->

  <!-- Wordmark top-right -->
  <text x="960" y="80" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em">MODULUS1</text>

  <!-- Kicker -->
  <text x="64" y="88" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#1F5C3D" letter-spacing="0.22em">SUSTAINABILITY</text>

  <!-- Headline -->
  <text x="64" y="142" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em">
    <tspan x="64" dy="0">Static baselines make</tspan>
    <tspan x="64" dy="52">your metrics lie.</tspan>
  </text>

  <!-- Accent underline under headline -->
  <rect x="64" y="210" width="180" height="3" rx="1.5" fill="#1F5C3D"/>

  <!-- MIDDLE BAND — 5 tiles: top row 2 wide, bottom row 3 -->

  <!-- Tile 1 -->
  <rect x="64" y="234" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="282" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">01</text>
  <text x="88" y="316" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">The Compliance Trap</text>
  <text x="88" y="346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#3A3A3A">Set a target, report it, watch it stagnate.</text>
  <line x1="88" y1="366" x2="474" y2="366" stroke="#11111120" stroke-width="1"/>
  <text x="88" y="390" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#3A3A3A">
    <tspan>Targets freeze while operations</tspan>
    <tspan x="88" dy="18">keep moving underneath them.</tspan>
  </text>

  <!-- Tile 2 -->
  <rect x="520" y="234" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="282" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">02</text>
  <text x="544" y="316" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">The Ghost Baseline</text>
  <text x="544" y="346" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#3A3A3A">A 2023 snapshot measuring a 2025 operation.</text>
  <line x1="544" y1="366" x2="930" y2="366" stroke="#11111120" stroke-width="1"/>
  <text x="544" y="390" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#3A3A3A">
    <tspan>Shift suppliers or mix — your baseline</tspan>
    <tspan x="544" dy="18">no longer reflects reality.</tspan>
  </text>

  <!-- Tile 3 -->
  <rect x="64" y="470" width="272" height="220" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="518" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">03</text>
  <text x="88" y="548" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111">Living Metrics</text>
  <text x="88" y="572" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#3A3A3A">
    <tspan>Tied to what you're</tspan>
    <tspan x="88" dy="18">actually doing right now.</tspan>
  </text>

  <!-- Tile 4 -->
  <rect x="352" y="470" width="272" height="220" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="376" y="518" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">04</text>
  <text x="376" y="548" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111">Auto-Recalibration</text>
  <text x="376" y="572" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#3A3A3A">
    <tspan>Add a line, retire equipment:</tspan>
    <tspan x="376" dy="18">baseline updates automatically.</tspan>
  </text>

  <!-- Tile 5 -->
  <rect x="640" y="470" width="320" height="220" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="664" y="518" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">05</text>
  <text x="664" y="548" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111">Honest Numbers</text>
  <text x="664" y="572" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#3A3A3A">
    <tspan>Not better dashboards —</tspan>
    <tspan x="664" dy="18">metrics that survive contact</tspan>
    <tspan x="664" dy="18">with reality.</tspan>
  </text>

  <!-- BOTTOM BAND -->
  <line x1="64" y1="726" x2="960" y2="726" stroke="#11111130" stroke-width="1"/>

  <text x="512" y="790" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#3A3A3A" letter-spacing="-0.01em">If it doesn't move with your business, it's just an old number.</text>

</svg>