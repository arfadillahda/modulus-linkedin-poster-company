<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="canvas-clip">
      <rect width="1024" height="1024"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ── TOP BAND ── -->

  <!-- Kicker -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" text-transform="uppercase">AI</text>

  <!-- Display Headline -->
  <text x="64" y="140" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <tspan x="64" dy="0">Silent Failures Hide</tspan>
    <tspan x="64" dy="56">Inside Your AI Model</tspan>
  </text>

  <!-- Accent underline under headline -->
  <rect x="64" y="204" width="200" height="3" rx="1.5" fill="#2D5BFF"/>

  <!-- Wordmark top-right -->
  <text x="960" y="76" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- ── MIDDLE BAND: 2×2 grid of 4 tiles ── -->
  <!-- Tile layout: 2 columns × 2 rows, 64px outer padding, 16px gap -->
  <!-- Column width: (1024 - 64 - 64 - 16) / 2 = 440px -->
  <!-- Row height: approx 270px each, gap 16px -->
  <!-- Top of tiles: ~240px, bottom ~796px -->

  <!-- Tile 01 — top-left: x=64, y=240, w=440, h=268 -->
  <rect x="64" y="240" width="440" height="268" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="302" font-size="48" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="96" y="344" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Static Checkpoint Trap</text>
  <text x="96" y="376" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Models assume deployment world matches training world.</text>
  <text x="96" y="420" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" opacity="0.75">Sensor drift and recalibration break that assumption.</text>

  <!-- Tile 02 — top-right: x=520, y=240, w=440, h=268 -->
  <rect x="520" y="240" width="440" height="268" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="302" font-size="48" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="552" y="344" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Confidence Stays High</text>
  <text x="552" y="376" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The model scores with certainty while predictions become noise.</text>
  <text x="552" y="420" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" opacity="0.75">Six weeks pass before anyone notices something is wrong.</text>

  <!-- Tile 03 — bottom-left: x=64, y=524, w=440, h=268 -->
  <rect x="64" y="524" width="440" height="268" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="586" font-size="48" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="96" y="628" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Distribution Shifts Constantly</text>
  <text x="96" y="660" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators change procedures, equipment gets swapped out.</text>
  <text x="96" y="704" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" opacity="0.75">Industrial environments never stay static — but models do.</text>

  <!-- Tile 04 — bottom-right: x=520, y=524, w=440, h=268 -->
  <rect x="520" y="524" width="440" height="268" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="586" font-size="48" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="552" y="628" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Observability Built In</text>
  <text x="552" y="660" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Drift detection embedded inside the inference pipeline itself.</text>
  <text x="552" y="704" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" opacity="0.75">The model flags unfamiliar data — not a separate monitor.</text>

  <!-- ── BOTTOM BAND ── -->

  <!-- Hairline rule -->
  <line x1="64" y1="826" x2="960" y2="826" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="892" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">When AI knows it's lost, you can actually trust it.</text>

</svg>