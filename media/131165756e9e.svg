<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ─── TOP BAND ─────────────────────────────────────────── -->

  <!-- Wordmark top-right -->
  <text
    x="960" y="80"
    text-anchor="end"
    font-size="12" font-weight="600"
    fill="#2D5BFF"
    letter-spacing="2.16"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker -->
  <text
    x="64" y="80"
    font-size="11" font-weight="600"
    fill="#2D5BFF"
    letter-spacing="2"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI</text>

  <!-- Display Headline line 1 -->
  <text
    x="64" y="128"
    font-size="46" font-weight="800"
    fill="#111111"
    letter-spacing="-1.2"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Confidence Scores Aren't</text>

  <!-- Display Headline line 2 -->
  <text
    x="64" y="182"
    font-size="46" font-weight="800"
    fill="#111111"
    letter-spacing="-1.2"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Calibration</text>

  <!-- Accent underline beneath headline -->
  <rect x="64" y="194" width="260" height="3" rx="1.5" fill="#2D5BFF"/>

  <!-- ─── MIDDLE BAND — 2×2 GRID ────────────────────────────── -->
  <!-- Grid origin: x=64, y=224 -->
  <!-- Tile size: (1024 - 64 - 64 - 16) / 2 = 440 wide -->
  <!-- Total height available ~ 624 - 224 = 400 → tiles 390 tall each row, 2 rows? -->
  <!-- Let's do 2×2: each tile 440w × 188h, gap 16, top=224 -->
  <!-- Row 1: y=224, Row 2: y=228+188+16=428 -->

  <!-- Tile 01 -->
  <rect x="64" y="224" width="440" height="188" rx="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="270"
        font-size="38" font-weight="800"
        fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="88" y="308"
        font-size="19" font-weight="700"
        fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Accuracy ≠ Calibration</text>
  <text x="88" y="336"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">You can nail precision-recall and still</text>
  <text x="88" y="356"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">ship miscalibrated confidence scores.</text>
  <text x="88" y="396"
        font-size="13" font-weight="400"
        fill="#3A3A3A" opacity="0"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"> </text>

  <!-- Tile 02 -->
  <rect x="520" y="224" width="440" height="188" rx="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="270"
        font-size="38" font-weight="800"
        fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="544" y="308"
        font-size="19" font-weight="700"
        fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Operator Problem</text>
  <text x="544" y="336"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">A 92% prediction fails half the time.</text>
  <text x="544" y="356"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators rightfully learn to ignore it.</text>

  <!-- Tile 03 -->
  <rect x="64" y="428" width="440" height="188" rx="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="474"
        font-size="38" font-weight="800"
        fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="88" y="512"
        font-size="19" font-weight="700"
        fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Calibration Drift Is Real</text>
  <text x="88" y="540"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The curve breaks when models hit a</text>
  <text x="88" y="560"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">different operating regime in production.</text>

  <!-- Tile 04 -->
  <rect x="520" y="428" width="440" height="188" rx="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="474"
        font-size="38" font-weight="800"
        fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="544" y="512"
        font-size="19" font-weight="700"
        fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Weekly Audit Fix</text>
  <text x="544" y="540"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Bucket predictions, measure actual success rate,</text>
  <text x="544" y="560"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">flag breaks. Two engineers, three SQL queries.</text>

  <!-- ─── LARGE TILE 05 spanning full width ─────────────────── -->
  <rect x="64" y="632" width="896" height="140" rx="16"
        fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="678"
        font-size="38" font-weight="800"
        fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">05</text>
  <text x="88" y="716"
        font-size="19" font-weight="700"
        fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Catch It Before Trust Erodes</text>
  <text x="88" y="744"
        font-size="14" font-weight="400"
        fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Miscalibration caught early; operators never learn to distrust the model.</text>

  <!-- ─── BOTTOM BAND ────────────────────────────────────────── -->

  <!-- Hairline rule -->
  <line x1="64" y1="808" x2="960" y2="808" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="860"
        text-anchor="middle"
        font-size="20" font-weight="700"
        fill="#3A3A3A"
        letter-spacing="-0.3"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Calibration is how operators learn to trust what you built.</text>

  <!-- Bottom padding spacer visual balance line -->
  <text x="512" y="960"
        text-anchor="middle"
        font-size="11" font-weight="600"
        fill="#2D5BFF"
        letter-spacing="2"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1 · MODEL RELIABILITY</text>

</svg>