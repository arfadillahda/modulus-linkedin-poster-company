<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════
       TOP BAND  (0 – 225px)
  ════════════════════════════════════════════════ -->

  <!-- Kicker label -->
  <text
    x="64" y="96"
    font-size="13" font-weight="600" fill="#1F5C3D"
    letter-spacing="0.18em" text-anchor="start"
    font-variant="small-caps" text-transform="uppercase">SUSTAINABILITY</text>

  <!-- Headline underline rule -->
  <line x1="64" y1="108" x2="280" y2="108" stroke="#1F5C3D" stroke-width="1.5"/>

  <!-- Display headline line 1 -->
  <text
    x="64" y="156"
    font-size="52" font-weight="800" fill="#111111"
    letter-spacing="-0.025em" text-anchor="start">Targets Fail When</text>

  <!-- Display headline line 2 -->
  <text
    x="64" y="214"
    font-size="52" font-weight="800" fill="#111111"
    letter-spacing="-0.025em" text-anchor="start">Operators Are Last</text>

  <!-- Wordmark top-right -->
  <text
    x="960" y="58"
    font-size="13" font-weight="600" fill="#1F5C3D"
    letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- ═══════════════════════════════════════════════
       MIDDLE BAND  (225 – 860px)  — 4 tiles in 2×2
  ════════════════════════════════════════════════ -->

  <!-- Tile layout:
       outer padding 64px each side → usable width = 1024 - 128 = 896px
       gap 16px, 2 columns → tile width = (896 - 16) / 2 = 440px
       band height 635px, gap 16px, 2 rows → tile height = (635 - 16) / 2 = 309.5 ≈ 310px
       top of band: y = 245 (some breathing room after headline)
  -->

  <!-- TILE 01 — top-left  x=64, y=245 -->
  <rect x="64" y="245" width="440" height="310" rx="16" ry="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>

  <!-- Numeral -->
  <text x="92" y="316"
        font-size="64" font-weight="800" fill="#1F5C3D"
        letter-spacing="-0.03em">01</text>

  <!-- Tile title -->
  <text x="92" y="360"
        font-size="22" font-weight="700" fill="#111111"
        letter-spacing="-0.01em">Strategy Sets the Number</text>

  <!-- Caption -->
  <text x="92" y="394"
        font-size="16" font-weight="400" fill="#3A3A3A">Finance and engineering own targets operators must hit.</text>

  <!-- Decorative hairline -->
  <line x1="92" y1="418" x2="476" y2="418" stroke="#11111130" stroke-width="0.75"/>

  <!-- Supporting sub-note -->
  <text x="92" y="444"
        font-size="14" font-weight="400" fill="#3A3A3A">Planning math ≠ operational math.</text>

  <!-- TILE 02 — top-right  x=520, y=245 -->
  <rect x="520" y="245" width="440" height="310" rx="16" ry="16"
        fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>

  <text x="548" y="316"
        font-size="64" font-weight="800" fill="#1F5C3D"
        letter-spacing="-0.03em">02</text>

  <text x="548" y="360"
        font-size="22" font-weight="700" fill="#111111"
        letter-spacing="-0.01em">Constraints Go Unmodelled</text>

  <text x="548" y="394"
        font-size="16" font-weight="400" fill="#3A3A3A">Equipment age, scheduling, material variability — all invisible.</text>

  <line x1="548" y1="418" x2="932" y2="418" stroke="#11111130" stroke-width="0.75"/>

  <text x="548" y="444"
        font-size="14" font-weight="400" fill="#3A3A3A">A 15% cut vs. a 20% throughput rise — something gives.</text>

  <!-- TILE 03 — bottom-left  x=64, y=571 -->
  <rect x="64" y="571" width="440" height="310" rx="16" ry="16"
        fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>

  <text x="92" y="642"
        font-size="64" font-weight="800" fill="#1F5C3D"
        letter-spacing="-0.03em">03</text>

  <text x="92" y="686"
        font-size="22" font-weight="700" fill="#111111"
        letter-spacing="-0.01em">Operators Know the Losses</text>

  <text x="92" y="720"
        font-size="16" font-weight="400" fill="#3A3A3A">Where energy disappears — they already see it.</text>

  <line x1="92" y1="744" x2="476" y2="744" stroke="#11111130" stroke-width="0.75"/>

  <text x="92" y="770"
        font-size="14" font-weight="400" fill="#3A3A3A">Years of workarounds = untapped operational insight.</text>

  <!-- TILE 04 — bottom-right  x=520, y=571 -->
  <rect x="520" y="571" width="440" height="310" rx="16" ry="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>

  <text x="548" y="642"
        font-size="64" font-weight="800" fill="#1F5C3D"
        letter-spacing="-0.03em">04</text>

  <text x="548" y="686"
        font-size="22" font-weight="700" fill="#111111"
        letter-spacing="-0.01em">Let Targets Emerge Up</text>

  <text x="548" y="720"
        font-size="16" font-weight="400" fill="#3A3A3A">Make operator knowledge visible, quantified, actionable.</text>

  <line x1="548" y1="744" x2="932" y2="744" stroke="#11111130" stroke-width="0.75"/>

  <text x="548" y="770"
        font-size="14" font-weight="400" fill="#3A3A3A">Set only targets that can actually move.</text>

  <!-- ═══════════════════════════════════════════════
       BOTTOM BAND  (900 – 1024px)
  ════════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="908" x2="960" y2="908" stroke="#11111140" stroke-width="1"/>

  <!-- Closing line -->
  <text
    x="512" y="970"
    font-size="22" font-weight="700" fill="#3A3A3A"
    letter-spacing="-0.01em" text-anchor="middle">Sustainability works on operator math, not planning math.</text>

</svg>