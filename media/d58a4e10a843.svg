<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- WORDMARK top-right -->
  <text x="960" y="44" text-anchor="end" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- TOP BAND -->
  <!-- Kicker -->
  <text x="64" y="72" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.22em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI</text>

  <!-- Display Headline line 1 -->
  <text x="64" y="122" font-size="48" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Accuracy Isn't Reliability.</text>
  <!-- Display Headline line 2 -->
  <text x="64" y="172" font-size="48" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Your Architecture Is.</text>

  <!-- Accent underline under headline -->
  <line x1="64" y1="184" x2="520" y2="184" stroke="#2D5BFF" stroke-width="2"/>

  <!-- MIDDLE BAND: 4 tiles in 2x2 grid -->
  <!-- Tile dimensions: col width = (1024 - 64 - 64 - 16) / 2 = 440, row height = (1024*0.62 - 16) / 2 ~ 300 -->
  <!-- Grid starts at y=210, outer padding 64, gap 16 -->
  <!-- Col1 x=64, Col2 x=64+440+16=520 -->
  <!-- Row1 y=210, Row2 y=210+296+16=522 -->

  <!-- Tile 01 -->
  <rect x="64" y="210" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="272" font-size="56" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="92" y="318" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Accuracy Measures</text>
  <text x="92" y="344" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">One Moment</text>
  <text x="92" y="378" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">A frozen test set can't see</text>
  <text x="92" y="396" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">how the real world moves.</text>
  <text x="92" y="480" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">F1, AUC, precision — table stakes,</text>
  <text x="92" y="498" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">not guarantees.</text>

  <!-- Tile 02 -->
  <rect x="520" y="210" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="272" font-size="56" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="548" y="318" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Distribution Drifts</text>
  <text x="548" y="344" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Silently</text>
  <text x="548" y="378" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Behavior shifts. Equipment degrades.</text>
  <text x="548" y="396" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Schemas change. Nobody was watching.</text>
  <text x="548" y="480" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">94% becomes 62% in three</text>
  <text x="548" y="498" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">months.</text>

  <!-- Tile 03 -->
  <rect x="64" y="522" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="584" font-size="56" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="92" y="630" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Two Different</text>
  <text x="92" y="656" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Problems</text>
  <text x="92" y="690" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Prediction performance vs. system</text>
  <text x="92" y="708" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">performance. Different solutions.</text>
  <text x="92" y="792" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Rollback, drift, explainability —</text>
  <text x="92" y="810" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">outside model scope.</text>

  <!-- Tile 04 -->
  <rect x="520" y="522" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="584" font-size="56" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="548" y="630" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Design for Graceful</text>
  <text x="548" y="656" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Degradation</text>
  <text x="548" y="690" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Industrial systems fail. Architecture</text>
  <text x="548" y="708" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">decides how badly.</text>
  <text x="548" y="792" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Degrade gracefully, not</text>
  <text x="548" y="810" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">catastrophically.</text>

  <!-- BOTTOM BAND -->
  <!-- Hairline rule -->
  <line x1="64" y1="854" x2="960" y2="854" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="912" text-anchor="middle" font-size="20" font-weight="600" fill="#3A3A3A" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Reliability is the architecture. Accuracy is just the entry fee.</text>

</svg>