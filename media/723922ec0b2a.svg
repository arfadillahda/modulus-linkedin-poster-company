<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- TOP BAND  (y: 0 → ~225px) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Wordmark top-right -->
  <text
    x="1012" y="76"
    text-anchor="end"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="0.18em"
    fill="#2D5BFF"
  >MODULUS1</text>

  <!-- Kicker -->
  <text
    x="64" y="80"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="11.5"
    font-weight="600"
    letter-spacing="0.18em"
    fill="#2D5BFF"
    text-anchor="start"
  >DIGITALIZATION</text>

  <!-- Headline line 1 -->
  <text
    x="64" y="138"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="-0.025em"
    fill="#111111"
    text-anchor="start"
  >Build for the operator,</text>

  <!-- Headline line 2 -->
  <text
    x="64" y="196"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="-0.025em"
    fill="#111111"
    text-anchor="start"
  >not the dashboard.</text>

  <!-- Accent underline beneath headline -->
  <line x1="64" y1="210" x2="420" y2="210" stroke="#2D5BFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- MIDDLE BAND  — 4-tile 2×2 grid                                -->
  <!-- Canvas width 1024, outer padding 64px                         -->
  <!-- Usable width = 1024 - 128 = 896px                             -->
  <!-- 2 cols, gap 16 → tile width = (896-16)/2 = 440               -->
  <!-- Top row y-start: 238, tile height: 315                         -->
  <!-- Bottom row y-start: 238+315+16 = 569                          -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- TILE 01 — top-left -->
  <rect x="64" y="238" width="440" height="315" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="92" y="304"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em">01</text>
  <!-- Title -->
  <text x="92" y="352"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Systems Built Around</text>
  <text x="92" y="379"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Management Goals</text>
  <!-- Caption -->
  <text x="92" y="423"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">Software solves what managers measure,</text>
  <text x="92" y="444"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">not what operators need to do.</text>

  <!-- TILE 02 — top-right -->
  <rect x="520" y="238" width="440" height="315" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="304"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em">02</text>
  <text x="548" y="352"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Two Teams,</text>
  <text x="548" y="379"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Different Languages</text>
  <text x="548" y="423"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">Digitalization optimizes visibility;</text>
  <text x="548" y="444"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">operations optimizes throughput and safety.</text>

  <!-- TILE 03 — bottom-left -->
  <rect x="64" y="569" width="440" height="315" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="635"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em">03</text>
  <text x="92" y="683"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Find the Real</text>
  <text x="92" y="710"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Constraint First</text>
  <text x="92" y="754"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">Ask what slows the operator right now —</text>
  <text x="92" y="775"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">decision, handoff, or buried knowledge.</text>

  <!-- TILE 04 — bottom-right -->
  <rect x="520" y="569" width="440" height="315" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="635"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em">04</text>
  <text x="548" y="683"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Layer Data Capture</text>
  <text x="548" y="710"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">on Wanted Workflows</text>
  <text x="548" y="754"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">Remove friction first, then add visibility</text>
  <text x="548" y="775"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15.5" font-weight="400" fill="#3A3A3A">on top of a tool people reach for.</text>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!-- BOTTOM BAND  (y: ~900 → 1024) -->
  <!-- ═══════════════════════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="912" x2="960" y2="912" stroke="#11111128" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="968"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="19" font-weight="400" letter-spacing="0.005em"
    fill="#3A3A3A" text-anchor="middle"
  >Digitalization wins when operators reach for it.</text>

</svg>