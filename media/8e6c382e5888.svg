<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="canvas-clip">
      <rect width="1024" height="1024"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TOP BAND: ~0–225px -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Kicker label -->
  <text
    x="64" y="96"
    font-size="13" font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.18em"
    text-anchor="start"
    font-variant="small-caps"
    text-transform="uppercase">SUSTAINABILITY</text>

  <!-- Wordmark top-right -->
  <text
    x="960" y="96"
    font-size="13" font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.18em"
    text-anchor="end">MODULUS1</text>

  <!-- Thin accent underline under kicker -->
  <line x1="64" y1="104" x2="200" y2="104" stroke="#1F5C3D" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Display Headline line 1 -->
  <text
    x="64" y="158"
    font-size="52" font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    text-anchor="start">Sustainability gets orphaned</text>

  <!-- Display Headline line 2 -->
  <text
    x="64" y="216"
    font-size="52" font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    text-anchor="start">when it's bolted on, not built in</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MIDDLE BAND: tiles ~248–860px — 4 tiles in 2×2 grid -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Grid dimensions -->
  <!-- Outer padding: 64px sides. Gap: 20px. Total width: 1024-128=896 -->
  <!-- Each tile width: (896-20)/2 = 438px -->
  <!-- Top row Y: 248. Tile height: 270. Gap: 20. Bottom row Y: 538. -->

  <!-- TILE 01 — top-left: x=64, y=248, w=438, h=270 -->
  <rect x="64" y="248" width="438" height="270" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="316" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">01</text>
  <text x="96" y="362" font-size="21" font-weight="700" fill="#111111" letter-spacing="-0.01em">Ownership is fragmented</text>
  <text x="96" y="396" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">Target, schedule, budget — owned by different teams</text>
  <text x="96" y="420" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">with no one owning achievability.</text>
  <!-- decorative rule -->
  <line x1="96" y1="448" x2="200" y2="448" stroke="#1F5C3D" stroke-width="1" opacity="0.35"/>
  <text x="96" y="472" font-size="13" font-weight="400" fill="#3A3A3A" letter-spacing="0.01em" font-style="italic">Treated as wishlist, not a problem to solve.</text>

  <!-- TILE 02 — top-right: x=522, y=248, w=438, h=270 -->
  <rect x="522" y="248" width="438" height="270" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="554" y="316" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">02</text>
  <text x="554" y="362" font-size="21" font-weight="700" fill="#111111" letter-spacing="-0.01em">Separated from real work</text>
  <text x="554" y="396" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">Sustainability sits in strategy or compliance,</text>
  <text x="554" y="420" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">disconnected from ops, throughput, and waste.</text>
  <line x1="554" y1="448" x2="658" y2="448" stroke="#1F5C3D" stroke-width="1" opacity="0.35"/>
  <text x="554" y="472" font-size="13" font-weight="400" fill="#3A3A3A" letter-spacing="0.01em" font-style="italic">Ops optimizes for throughput. Sustainability watches.</text>

  <!-- TILE 03 — bottom-left: x=64, y=538, w=438, h=270 -->
  <rect x="64" y="538" width="438" height="270" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="606" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">03</text>
  <text x="96" y="652" font-size="21" font-weight="700" fill="#111111" letter-spacing="-0.01em">Reverse-index from ops</text>
  <text x="96" y="686" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">Start with the ops constraint: throughput, labor,</text>
  <text x="96" y="710" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">equipment, or material cost this quarter.</text>
  <line x1="96" y1="738" x2="200" y2="738" stroke="#1F5C3D" stroke-width="1" opacity="0.35"/>
  <text x="96" y="762" font-size="13" font-weight="400" fill="#3A3A3A" letter-spacing="0.01em" font-style="italic">Build the sustainability goal inside that constraint.</text>

  <!-- TILE 04 — bottom-right: x=522, y=538, w=438, h=270 -->
  <rect x="522" y="538" width="438" height="270" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="554" y="606" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">04</text>
  <text x="554" y="652" font-size="21" font-weight="700" fill="#111111" letter-spacing="-0.01em">Make it the same equation</text>
  <text x="554" y="686" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">Embed the sustainability metric inside the dispatch</text>
  <text x="554" y="710" font-size="15" font-weight="400" fill="#3A3A3A" letter-spacing="0em">problem — a real cost and throughput variable.</text>
  <line x1="554" y1="738" x2="658" y2="738" stroke="#1F5C3D" stroke-width="1" opacity="0.35"/>
  <text x="554" y="762" font-size="13" font-weight="400" fill="#3A3A3A" letter-spacing="0.01em" font-style="italic">Optimize the schedule; optimize the target too.</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BOTTOM BAND: ~860–1024px -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="858" x2="960" y2="858" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text
    x="512" y="930"
    font-size="22" font-weight="700"
    fill="#3A3A3A"
    letter-spacing="-0.01em"
    text-anchor="middle">Targets stop being orphaned when embedded in real work.</text>

  <!-- Sub-closing attribution -->
  <text
    x="512" y="968"
    font-size="13" font-weight="400"
    fill="#3A3A3A"
    letter-spacing="0.06em"
    text-anchor="middle" opacity="0.6">MODULUS1 · OPERATIONS &amp; SUSTAINABILITY INTELLIGENCE</text>

</svg>