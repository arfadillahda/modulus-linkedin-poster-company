<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ── TOP BAND ── -->

  <!-- Wordmark top-right -->
  <text x="960" y="76" text-anchor="end" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker -->
  <text x="64" y="82" text-anchor="start" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.22em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">DIGITALIZATION</text>

  <!-- Display headline -->
  <text x="64" y="134" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Software that speaks</text>
  <text x="64" y="186" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">the operator's language</text>

  <!-- Accent underline under headline -->
  <rect x="64" y="198" width="320" height="3" rx="1.5" fill="#2D5BFF"/>

  <!-- ── MIDDLE BAND — 4 tiles in 2×2 grid ── -->

  <!-- Tile dimensions: canvas 1024, padding 64, gap 16 -->
  <!-- Two columns: (1024 - 64 - 64 - 16) / 2 = 440 wide each -->
  <!-- Two rows: top y=228, bottom y=228+220+16=464; height=220 -->

  <!-- TILE 01 — top-left: x=64, y=228 -->
  <rect x="64" y="228" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="280" font-size="40" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="92" y="320" font-size="18" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">One Size Fails All</text>
  <text x="92" y="348" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Vendors design for the average</text>
  <text x="92" y="368" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">operator — not yours.</text>
  <!-- small decorative rule -->
  <rect x="92" y="408" width="32" height="2" rx="1" fill="#2D5BFF" opacity="0.35"/>

  <!-- TILE 02 — top-right: x=520, y=228 -->
  <rect x="520" y="228" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="280" font-size="40" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="548" y="320" font-size="18" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Taxonomy Mismatch</text>
  <text x="548" y="348" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">A mill's downtime terms differ</text>
  <text x="548" y="368" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">entirely from a mine's.</text>
  <rect x="548" y="408" width="32" height="2" rx="1" fill="#2D5BFF" opacity="0.35"/>

  <!-- TILE 03 — bottom-left: x=64, y=464 -->
  <rect x="64" y="464" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="516" font-size="40" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="92" y="556" font-size="18" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Forced Trade-off</text>
  <text x="92" y="584" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Rigid or endless customization —</text>
  <text x="92" y="604" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">neither option ships.</text>
  <rect x="92" y="644" width="32" height="2" rx="1" fill="#2D5BFF" opacity="0.35"/>

  <!-- TILE 04 — bottom-right: x=520, y=464 -->
  <rect x="520" y="464" width="440" height="220" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="516" font-size="40" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="548" y="556" font-size="18" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Context-Aware Schema</text>
  <text x="548" y="584" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Capture real terminology early;</text>
  <text x="548" y="604" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">generate models from operator data.</text>
  <rect x="548" y="644" width="32" height="2" rx="1" fill="#2D5BFF" opacity="0.35"/>

  <!-- ── BOTTOM BAND ── -->

  <!-- Hairline rule -->
  <line x1="64" y1="730" x2="960" y2="730" stroke="#11111118" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="790" text-anchor="middle" font-size="20" font-weight="700" fill="#3A3A3A" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The system adapts to them. Not the reverse.</text>

</svg>