<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ══════════════════════════════════════════
       TOP BAND (~0–225px)
  ══════════════════════════════════════════ -->

  <!-- Wordmark top-right -->
  <text
    x="960" y="80"
    text-anchor="end"
    font-size="12" font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.18em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker label -->
  <text
    x="64" y="82"
    text-anchor="start"
    font-size="11" font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.18em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">SUSTAINABILITY</text>

  <!-- Display headline line 1 -->
  <text
    x="64" y="138"
    text-anchor="start"
    font-size="52" font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Metrics that hold up</text>

  <!-- Display headline line 2 -->
  <text
    x="64" y="196"
    text-anchor="start"
    font-size="52" font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">when work actually happens</text>

  <!-- Accent underline beneath headline -->
  <line x1="64" y1="212" x2="700" y2="212" stroke="#1F5C3D" stroke-width="2.5"/>

  <!-- ══════════════════════════════════════════
       MIDDLE BAND — 4 TILES in 2×2 grid
       Grid origin: x=64, y=240
       Each tile: w=432, h=296, gap=16
  ══════════════════════════════════════════ -->

  <!-- TILE 01 — top-left (x=64, y=240) -->
  <rect x="64" y="240" width="432" height="296" rx="16" ry="16"
    fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>

  <!-- Numeral 01 -->
  <text x="92" y="316"
    font-size="64" font-weight="800"
    fill="#1F5C3D" letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>

  <!-- Tile 01 title -->
  <text x="92" y="360"
    font-size="22" font-weight="700"
    fill="#111111"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Measure What Moves</text>

  <!-- Tile 01 caption -->
  <text x="92" y="394"
    font-size="15" font-weight="400"
    fill="#3A3A3A"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Easy counts ≠ what actually drives change</text>

  <!-- TILE 02 — top-right (x=528, y=240) -->
  <rect x="528" y="240" width="432" height="296" rx="16" ry="16"
    fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>

  <!-- Numeral 02 -->
  <text x="556" y="316"
    font-size="64" font-weight="800"
    fill="#1F5C3D" letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>

  <!-- Tile 02 title -->
  <text x="556" y="360"
    font-size="22" font-weight="700"
    fill="#111111"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Bypassed Logic</text>

  <!-- Tile 02 caption -->
  <text x="556" y="394"
    font-size="15" font-weight="400"
    fill="#3A3A3A"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators skip benchmarks when shifts demand it</text>

  <!-- TILE 03 — bottom-left (x=64, y=552) -->
  <rect x="64" y="552" width="432" height="296" rx="16" ry="16"
    fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>

  <!-- Numeral 03 -->
  <text x="92" y="628"
    font-size="64" font-weight="800"
    fill="#1F5C3D" letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>

  <!-- Tile 03 title -->
  <text x="92" y="672"
    font-size="22" font-weight="700"
    fill="#111111"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Bolted-On Fails</text>

  <!-- Tile 03 caption -->
  <text x="92" y="706"
    font-size="15" font-weight="400"
    fill="#3A3A3A"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Constraint layers on old workflows become fiction</text>

  <!-- TILE 04 — bottom-right (x=528, y=552) -->
  <rect x="528" y="552" width="432" height="296" rx="16" ry="16"
    fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>

  <!-- Numeral 04 -->
  <text x="556" y="628"
    font-size="64" font-weight="800"
    fill="#1F5C3D" letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>

  <!-- Tile 04 title -->
  <text x="556" y="672"
    font-size="22" font-weight="700"
    fill="#111111"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Bake It In</text>

  <!-- Tile 04 caption -->
  <text x="556" y="706"
    font-size="15" font-weight="400"
    fill="#3A3A3A"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Embed efficiency into how work is sequenced</text>

  <!-- ══════════════════════════════════════════
       BOTTOM BAND (~864–1024px)
  ══════════════════════════════════════════ -->

  <!-- Hairline rule above closing line -->
  <line x1="64" y1="884" x2="960" y2="884" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="944"
    text-anchor="middle"
    font-size="21" font-weight="400"
    fill="#3A3A3A"
    letter-spacing="0.01em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">When sustainability is operational, the numbers hold in real time.</text>

</svg>