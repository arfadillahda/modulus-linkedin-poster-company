<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->

  <!-- Kicker label -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="start" font-variant="small-caps" text-transform="uppercase">SUSTAINABILITY</text>

  <!-- Headline -->
  <text x="64" y="148" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em">
    <tspan x="64" dy="0">Operators ignore software</tspan>
    <tspan x="64" dy="52">that never talks back</tspan>
  </text>

  <!-- Accent underline under headline -->
  <rect x="64" y="207" width="120" height="3" rx="1.5" fill="#1F5C3D"/>

  <!-- MODULUS1 wordmark top-right -->
  <text x="960" y="54" font-size="12" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- MIDDLE BAND — 2x2 grid of 4 tiles -->
  <!-- Tile dimensions: gap=16, padding=64, canvas=1024 -->
  <!-- 2 columns: (1024 - 64 - 64 - 16) / 2 = 440 wide each -->
  <!-- Tile top: 240, tile height: ~290, gap=16, so bottom row top=546 -->
  <!-- Total tile area height: 290+16+290=596, bottom: 240+596=836 -->

  <!-- Tile 01 — top left -->
  <rect x="64" y="240" width="440" height="290" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="296" font-size="38" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">01</text>
  <text x="92" y="336" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.01em">One-directional data flow</text>
  <text x="92" y="364" font-size="14" font-weight="400" fill="#3A3A3A">Consumption data flows up; nothing returns to operators.</text>

  <!-- Tile 02 — top right -->
  <rect x="520" y="240" width="440" height="290" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="296" font-size="38" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">02</text>
  <text x="548" y="336" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.01em">No intuition, no trust</text>
  <text x="548" y="364" font-size="14" font-weight="400" fill="#3A3A3A">Without feedback, operators can't trust or improve the model.</text>

  <!-- Tile 03 — bottom left -->
  <rect x="64" y="546" width="440" height="290" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="602" font-size="38" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">03</text>
  <text x="92" y="642" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.01em">The missing closed loop</text>
  <text x="92" y="670" font-size="14" font-weight="400" fill="#3A3A3A">Shift decisions never link back to actual carbon outcomes.</text>

  <!-- Tile 04 — bottom right -->
  <rect x="520" y="546" width="440" height="290" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="602" font-size="38" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">04</text>
  <text x="548" y="642" font-size="18" font-weight="700" fill="#111111" letter-spacing="-0.01em">Real-time cause and effect</text>
  <text x="548" y="670" font-size="14" font-weight="400" fill="#3A3A3A">Setpoint change → carbon impact visible within minutes.</text>

  <!-- BOTTOM BAND -->
  <!-- Hairline rule -->
  <line x1="64" y1="870" x2="960" y2="870" stroke="#11111118" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="916" font-size="18" font-weight="600" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em">Show operators their work moves something real.</text>

</svg>