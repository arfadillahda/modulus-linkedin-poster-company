<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->
  <!-- Kicker label -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#C24A1F" letter-spacing="0.18em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">DIGITALIZATION</text>

  <!-- Display headline -->
  <text x="64" y="148" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <tspan x="64" dy="0">Stop measuring the tool.</tspan>
    <tspan x="64" dy="54">Measure the actual problem.</tspan>
  </text>

  <!-- Accent underline under headline -->
  <line x1="64" y1="214" x2="340" y2="214" stroke="#C24A1F" stroke-width="2"/>

  <!-- MODULUS1 wordmark top-right -->
  <text x="960" y="72" font-size="12" font-weight="600" fill="#C24A1F" letter-spacing="0.18em" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- MIDDLE BAND: 2x2 grid of 4 tiles -->
  <!-- Tile layout: 2 columns, 2 rows. Canvas 1024, outer pad 64, gap 16 -->
  <!-- Col width: (1024 - 64 - 64 - 16) / 2 = 440 -->
  <!-- Row height: ~220px each, gap 16 -->
  <!-- Top row starts at y=244, bottom row at y=244+220+16=480 -->

  <!-- Tile 01 — Top Left -->
  <rect x="64" y="244" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="90" y="295" font-size="52" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="90" y="335" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">We Measure What's Easy</text>
  <text x="90" y="367" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Logins and dashboards — not operational outcomes.</text>
  <text x="90" y="390" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Easy to instrument, disconnected from the plant.</text>

  <!-- Tile 02 — Top Right -->
  <rect x="520" y="244" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="546" y="295" font-size="52" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="546" y="335" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Adoption Isn't Value</text>
  <text x="546" y="367" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">A system can be used and still solve zero</text>
  <text x="546" y="390" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">problems for operators on the floor.</text>

  <!-- Tile 03 — Bottom Left -->
  <rect x="64" y="480" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="90" y="531" font-size="52" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="90" y="571" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Reframe the Metric</text>
  <text x="90" y="603" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Not "logs created" — unplanned downtime reduced.</text>
  <text x="90" y="626" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Tie the tool directly to the problem you claim.</text>

  <!-- Tile 04 — Bottom Right -->
  <rect x="520" y="480" width="440" height="220" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="546" y="531" font-size="52" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="546" y="571" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Two Weeks, Real Signal</text>
  <text x="546" y="603" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators see value. You see whether the tool</text>
  <text x="546" y="626" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">actually matters — within two weeks.</text>

  <!-- BOTTOM BAND -->
  <!-- Hairline rule -->
  <line x1="64" y1="746" x2="960" y2="746" stroke="#11111118" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="810" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Measure the outcome, not the tool adoption.</text>

  <!-- Supporting caption -->
  <text x="512" y="844" font-size="13" font-weight="400" fill="#3A3A3A" text-anchor="middle" letter-spacing="0.04em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1  ·  INDUSTRIAL DIGITALIZATION</text>

</svg>