<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ───────────────────────────────────────────
       TOP BAND  (0 – 225px)
  ─────────────────────────────────────────────── -->

  <!-- Kicker -->
  <text x="64" y="86" font-size="11" font-weight="600" fill="#2D5BFF"
        letter-spacing="0.18em" text-anchor="start"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI</text>

  <!-- Display headline -->
  <text font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-weight="800" fill="#111111" letter-spacing="-0.025em">
    <tspan x="64" y="138" font-size="52">Demos Pass.</tspan>
    <tspan x="64" dy="60" font-size="52">Operations Reject.</tspan>
  </text>

  <!-- Accent underline under headline -->
  <line x1="64" y1="212" x2="340" y2="212" stroke="#2D5BFF" stroke-width="2"/>

  <!-- Wordmark top-right -->
  <text x="960" y="86" font-size="12" font-weight="600" fill="#2D5BFF"
        letter-spacing="0.18em" text-anchor="end"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- ───────────────────────────────────────────
       MIDDLE BAND  (225 – 860px)
       4 points → 2×2 grid
       Outer padding 64px, gap 16px
       Column width: (1024 - 128 - 16) / 2 = 440px
       Row height:   (860 - 225 - 16 - 32) / 2 = 293px
         top of grid: y = 240
  ─────────────────────────────────────────────── -->

  <!-- Tile geometry:
       col1 x=64,   col2 x=64+440+16=520
       row1 y=240,  row2 y=240+293+16=549
       w=440, h=293
  -->

  <!-- TILE 01 — col1 row1 -->
  <rect x="64" y="240" width="440" height="293" rx="16" ry="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="294" font-size="42" font-weight="800" fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        letter-spacing="-0.02em">01</text>
  <text x="88" y="336" font-size="20" font-weight="700" fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Build on Real Workflows</text>
  <text x="88" y="372" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators skip steps and circle back constantly.</text>
  <text x="88" y="392" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sanitized data misses the actual floor reality.</text>

  <!-- TILE 02 — col2 row1 -->
  <rect x="520" y="240" width="440" height="293" rx="16" ry="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="294" font-size="42" font-weight="800" fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        letter-spacing="-0.02em">02</text>
  <text x="544" y="336" font-size="20" font-weight="700" fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Watch, Don't Just Ask</text>
  <text x="544" y="372" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Observe operators in their environment before</text>
  <text x="544" y="392" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">training anything. Map decisions that actually happen.</text>

  <!-- TILE 03 — col1 row2 -->
  <rect x="64" y="549" width="440" height="293" rx="16" ry="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="603" font-size="42" font-weight="800" fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        letter-spacing="-0.02em">03</text>
  <text x="88" y="645" font-size="20" font-weight="700" fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Find the Right Gates</text>
  <text x="88" y="681" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Not every decision gate is automatable. Some need</text>
  <text x="88" y="701" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">human judgment or context you can't encode.</text>

  <!-- TILE 04 — col2 row2 -->
  <rect x="520" y="549" width="440" height="293" rx="16" ry="16"
        fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="603" font-size="42" font-weight="800" fill="#2D5BFF"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        letter-spacing="-0.02em">04</text>
  <text x="544" y="645" font-size="20" font-weight="700" fill="#111111"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Augment, Don't Replace</text>
  <text x="544" y="681" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Design the model to improve specific gates,</text>
  <text x="544" y="701" font-size="14.5" font-weight="400" fill="#3A3A3A"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif">not to overhaul the entire workflow.</text>

  <!-- ───────────────────────────────────────────
       BOTTOM BAND  (860 – 1024px)
  ─────────────────────────────────────────────── -->

  <!-- Hairline rule -->
  <line x1="64" y1="876" x2="960" y2="876" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="940" font-size="19" font-weight="400" fill="#3A3A3A"
        text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        letter-spacing="-0.01em">
    Incomplete problem framing kills more AI projects than bad models.
  </text>

</svg>