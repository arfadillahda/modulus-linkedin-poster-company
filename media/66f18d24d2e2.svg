<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->
  <!-- Kicker -->
  <text x="64" y="96" font-size="12" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="start" font-variant="small-caps">SUSTAINABILITY</text>

  <!-- Headline -->
  <text x="64" y="148" font-size="52" font-weight="800" fill="#111111" letter-spacing="-0.02em">
    <tspan x="64" dy="0">Baselines that break</tspan>
    <tspan x="64" dy="60">when operations change</tspan>
  </text>

  <!-- Accent underline under headline -->
  <rect x="64" y="220" width="320" height="3" rx="1.5" fill="#1F5C3D"/>

  <!-- Wordmark top-right -->
  <text x="960" y="52" font-size="13" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- MIDDLE BAND: 2x2 grid of 4 tiles -->
  <!-- Tile dimensions: cols = (1024 - 64 - 64 - 16) / 2 = 440, rows calculated -->
  <!-- Tile W: 440, Tile H: ~240 -->
  <!-- Row 1 Y: 252, Row 2 Y: 252+240+16=508 -->
  <!-- Col 1 X: 64, Col 2 X: 64+440+16=520 -->

  <!-- TILE 01 -->
  <rect x="64" y="252" width="440" height="248" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="304" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">01</text>
  <text x="92" y="336" font-size="18" font-weight="700" fill="#111111">Static baselines</text>
  <text x="92" y="364" font-size="14" font-weight="400" fill="#3A3A3A">Sustainability software assumes a fixed operational footprint.</text>
  <text x="92" y="384" font-size="14" font-weight="400" fill="#3A3A3A">Equipment swaps invalidate the target silently.</text>

  <!-- TILE 02 -->
  <rect x="520" y="252" width="440" height="248" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="304" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">02</text>
  <text x="548" y="336" font-size="18" font-weight="700" fill="#111111">Not a data problem</text>
  <text x="548" y="364" font-size="14" font-weight="400" fill="#3A3A3A">Platforms call it data quality. It is</text>
  <text x="548" y="384" font-size="14" font-weight="400" fill="#3A3A3A">an architecture problem underneath.</text>

  <!-- TILE 03 -->
  <rect x="64" y="516" width="440" height="248" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="568" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">03</text>
  <text x="92" y="600" font-size="18" font-weight="700" fill="#111111">Derived views</text>
  <text x="92" y="628" font-size="14" font-weight="400" fill="#3A3A3A">Metrics built on live operational state,</text>
  <text x="92" y="648" font-size="14" font-weight="400" fill="#3A3A3A">not isolated datasets that drift apart.</text>

  <!-- TILE 04 -->
  <rect x="520" y="516" width="440" height="248" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="568" font-size="44" font-weight="800" fill="#1F5C3D" letter-spacing="-0.01em">04</text>
  <text x="548" y="600" font-size="18" font-weight="700" fill="#111111">Baseline follows the plant</text>
  <text x="548" y="628" font-size="14" font-weight="400" fill="#3A3A3A">Every pump swap, shift change, or process</text>
  <text x="548" y="648" font-size="14" font-weight="400" fill="#3A3A3A">update recalculates KPIs automatically.</text>

  <!-- BOTTOM BAND -->
  <!-- Hairline rule -->
  <line x1="64" y1="808" x2="960" y2="808" stroke="#11111118" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="868" font-size="22" font-weight="600" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em">Operations change. Your measurement should too.</text>

</svg>