<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->
  <!-- Kicker -->
  <text x="64" y="94" font-size="11" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">SUSTAINABILITY</text>

  <!-- Display Headline -->
  <text x="64" y="138" font-size="42" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators don't resist data.</text>
  <text x="64" y="186" font-size="42" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neve', Arial, sans-serif">They resist data that ignores them.</text>

  <!-- Accent underline under headline -->
  <rect x="64" y="198" width="180" height="2" fill="#1F5C3D" rx="1"/>

  <!-- Wordmark top-right -->
  <text x="960" y="78" font-size="12" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- MIDDLE BAND — 2×2 grid of tiles -->

  <!-- Tile 01 — top left -->
  <rect x="64" y="228" width="432" height="320" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="286" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="96" y="322" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Data flows upward</text>
  <text x="96" y="353" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Built for execs, not the</text>
  <text x="96" y="372" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">people running the line.</text>

  <!-- Tile 02 — top right -->
  <rect x="528" y="228" width="432" height="320" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="560" y="286" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="560" y="322" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Workarounds emerge</text>
  <text x="560" y="353" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sensor lag + 20s overhead</text>
  <text x="560" y="372" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">means operators bypass the system.</text>

  <!-- Tile 03 — bottom left -->
  <rect x="64" y="564" width="432" height="320" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="622" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="96" y="658" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Solve their problem first</text>
  <text x="96" y="689" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Track downtime before energy.</text>
  <text x="96" y="708" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Changeover before waste.</text>

  <!-- Tile 04 — bottom right -->
  <rect x="528" y="564" width="432" height="320" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="560" y="622" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="560" y="658" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Embed, don't bolt on</text>
  <text x="560" y="689" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Layer sustainability onto metrics</text>
  <text x="560" y="708" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">operators already care about.</text>

  <!-- BOTTOM BAND -->
  <line x1="64" y1="912" x2="960" y2="912" stroke="#11111118" stroke-width="1"/>
  <text x="512" y="958" font-size="18" font-weight="400" fill="#3A3A3A" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Compliance follows when sustainability lives in daily operations.</text>

</svg>