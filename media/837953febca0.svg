<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->
  <!-- Kicker -->
  <text x="64" y="88" font-size="11" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">SUSTAINABILITY</text>

  <!-- Wordmark top-right -->
  <text x="960" y="88" font-size="11" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Display Headline -->
  <text x="64" y="138" font-size="44" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sustainability is a design</text>
  <text x="64" y="190" font-size="44" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">constraint, not a report.</text>

  <!-- Accent underline under headline -->
  <line x1="64" y1="204" x2="540" y2="204" stroke="#1F5C3D" stroke-width="2"/>

  <!-- MIDDLE BAND: 2x2 grid of 4 tiles -->
  <!-- Tile layout: 2 columns, 2 rows, gap 16px, outer pad 64px -->
  <!-- Column width: (1024 - 64 - 64 - 16) / 2 = 440 -->
  <!-- Row height: (1024*0.62 - 16) / 2 = (634 - 16) / 2 = 309 -->
  <!-- Middle band top: ~224, height ~634, bottom ~858 -->
  <!-- Adjusted: top=228, tile height=296 -->

  <!-- Tile 1: top-left x=64, y=228 -->
  <rect x="64" y="228" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="290" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="96" y="332" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Compliance Trap</text>
  <text x="96" y="364" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Emissions get counted, then filed.</text>
  <text x="96" y="384" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Nothing in the system changes.</text>

  <!-- Tile 2: top-right x=520, y=228 -->
  <rect x="520" y="228" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="290" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="552" y="332" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Missing Constraint</text>
  <text x="552" y="364" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Routes optimize speed. Schedules optimize</text>
  <text x="552" y="384" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">availability. Waste is never in the function.</text>

  <!-- Tile 3: bottom-left x=64, y=540 -->
  <rect x="64" y="540" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="602" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="96" y="644" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Pull Upstream</text>
  <text x="96" y="676" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Embed waste reduction into route planning,</text>
  <text x="96" y="696" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">maintenance intervals, and scheduling logic.</text>

  <!-- Tile 4: bottom-right x=520, y=540 -->
  <rect x="520" y="540" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="602" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="552" y="644" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Better on Every Metric</text>
  <text x="552" y="676" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Idle capacity, redundant routes, over-maintenance:</text>
  <text x="552" y="696" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">the sustainability case builds itself.</text>

  <!-- BOTTOM BAND -->
  <!-- Hairline rule -->
  <line x1="64" y1="868" x2="960" y2="868" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="918" font-size="18" font-weight="400" fill="#3A3A3A" text-anchor="middle" letter-spacing="0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Design waste out. Performance follows.</text>

</svg>