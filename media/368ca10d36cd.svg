<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <clipPath id="tile1clip">
      <rect x="64" y="268" width="432" height="300" rx="16"/>
    </clipPath>
    <clipPath id="tile2clip">
      <rect x="528" y="268" width="432" height="300" rx="16"/>
    </clipPath>
    <clipPath id="tile3clip">
      <rect x="64" y="588" width="272" height="180" rx="16"/>
    </clipPath>
    <clipPath id="tile4clip">
      <rect x="356" y="588" width="272" height="180" rx="16"/>
    </clipPath>
    <clipPath id="tile5clip">
      <rect x="648" y="588" width="312" height="180" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════
       TOP BAND
  ═══════════════════════════════════════════ -->

  <!-- Wordmark top-right -->
  <text
    x="960"
    y="44"
    text-anchor="end"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="600"
    letter-spacing="0.18em"
    fill="#1F5C3D">MODULUS1</text>

  <!-- Kicker -->
  <text
    x="64"
    y="80"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="600"
    letter-spacing="0.18em"
    fill="#1F5C3D">SUSTAINABILITY</text>

  <!-- Headline -->
  <text
    x="64"
    y="140"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="56"
    font-weight="800"
    letter-spacing="-0.02em"
    fill="#111111">Measure where
  </text>
  <text
    x="64"
    y="200"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="56"
    font-weight="800"
    letter-spacing="-0.02em"
    fill="#111111">action happens</text>

  <!-- Headline underline accent -->
  <line x1="64" y1="218" x2="340" y2="218" stroke="#1F5C3D" stroke-width="2"/>


  <!-- ═══════════════════════════════════════════
       MIDDLE BAND — 2×2 top row + 3-tile bottom row (5 tiles total)
       Top row: tile 01, tile 02 — tall cards 432px wide 300px tall
       Bottom row: tile 03, tile 04, tile 05 — short cards 272/272/312 wide 180px tall
  ═══════════════════════════════════════════ -->

  <!-- TILE 01 -->
  <rect x="64" y="252" width="432" height="300" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="88" y="312" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="#1F5C3D">01</text>
  <!-- Title -->
  <text x="88" y="356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">Top-Down</text>
  <text x="88" y="382" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">Measurement</text>
  <!-- Caption -->
  <text x="88" y="422" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3A3A3A">Platforms report facility totals,</text>
  <text x="88" y="442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3A3A3A">not equipment-level reality.</text>

  <!-- TILE 02 -->
  <rect x="528" y="252" width="432" height="300" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="552" y="312" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="800" fill="#1F5C3D">02</text>
  <!-- Title -->
  <text x="552" y="356" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">Operators</text>
  <text x="552" y="382" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#111111">Disengage</text>
  <!-- Caption -->
  <text x="552" y="422" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3A3A3A">No feedback loop means operators</text>
  <text x="552" y="442" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#3A3A3A">ignore the software entirely.</text>

  <!-- TILE 03 -->
  <rect x="64" y="572" width="272" height="196" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="86" y="618" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">03</text>
  <!-- Title -->
  <text x="86" y="650" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111">Push the Meter</text>
  <!-- Caption line 1 -->
  <text x="86" y="676" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A3A">Delegate measurement to</text>
  <text x="86" y="694" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A3A">the equipment that matters.</text>

  <!-- TILE 04 -->
  <rect x="356" y="572" width="272" height="196" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="378" y="618" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">04</text>
  <!-- Title -->
  <text x="378" y="650" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111">Units That Stick</text>
  <!-- Caption -->
  <text x="378" y="676" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A3A">kWh per ton, not vague</text>
  <text x="378" y="694" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A3A">percentage comparisons.</text>

  <!-- TILE 05 -->
  <rect x="648" y="572" width="312" height="196" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="672" y="618" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#1F5C3D">05</text>
  <!-- Title -->
  <text x="672" y="650" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#111111">Data Still Rolls Up</text>
  <!-- Caption -->
  <text x="672" y="676" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A3A">Operators act first; boards</text>
  <text x="672" y="694" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#3A3A3A">see the aggregate second.</text>


  <!-- ═══════════════════════════════════════════
       BOTTOM BAND
  ═══════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="796" x2="960" y2="796" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text
    x="512"
    y="848"
    text-anchor="middle"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="400"
    letter-spacing="-0.01em"
    fill="#3A3A3A">You can't sustain what you can't see at the point of action.</text>

</svg>