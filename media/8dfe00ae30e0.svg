<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════
       TOP BAND  (y: 0 – 225)
       Outer padding: 64px
  ════════════════════════════════════════════ -->

  <!-- Wordmark top-right -->
  <text
    x="960" y="84"
    font-size="13" font-weight="600"
    fill="#2D5BFF"
    letter-spacing="0.18em"
    text-anchor="end"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker label -->
  <text
    x="64" y="84"
    font-size="11" font-weight="600"
    fill="#2D5BFF"
    letter-spacing="0.22em"
    text-anchor="start"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI</text>

  <!-- Display headline -->
  <text
    x="64" y="136"
    font-size="52" font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    text-anchor="start"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Notebook ≠ Production.</text>

  <text
    x="64" y="196"
    font-size="52" font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    text-anchor="start"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Know the gap.</text>

  <!-- Accent underline under headline -->
  <line x1="64" y1="210" x2="420" y2="210" stroke="#2D5BFF" stroke-width="2.5"/>

  <!-- ═══════════════════════════════════════════
       MIDDLE BAND — 4-tile 2×2 grid
       Grid starts y=236, ends y=796
       Each tile: W=(1024-64-64-16)/2 = 440, H=(796-236-16)/2 = 272
       Col1 x=64, Col2 x=64+440+16=520
       Row1 y=236, Row2 y=236+272+16=524
  ════════════════════════════════════════════ -->

  <!-- TILE 01 — top-left -->
  <rect x="64" y="236" width="440" height="272" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="302" font-size="54" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="96" y="352" font-size="21" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Closed System</text>
  <text x="96" y="388" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Notebooks use clean data and</text>
  <text x="96" y="408" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">controlled inputs. Production doesn't.</text>
  <!-- decorative rule -->
  <line x1="96" y1="438" x2="460" y2="438" stroke="#2D5BFF" stroke-width="1" stroke-opacity="0.25"/>
  <text x="96" y="462" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The environment is the failure.</text>

  <!-- TILE 02 — top-right -->
  <rect x="520" y="236" width="440" height="272" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="302" font-size="54" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="552" y="352" font-size="21" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Null &amp; Missing Fields</text>
  <text x="552" y="388" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Real inputs arrive incomplete.</text>
  <text x="552" y="408" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Test what the notebook never saw.</text>
  <line x1="552" y1="438" x2="916" y2="438" stroke="#2D5BFF" stroke-width="1" stroke-opacity="0.25"/>
  <text x="552" y="462" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Failure mode one: build synthetic cases.</text>

  <!-- TILE 03 — bottom-left -->
  <rect x="64" y="524" width="440" height="272" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="590" font-size="54" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="96" y="640" font-size="21" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Out-of-Order Data</text>
  <text x="96" y="676" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Delayed or sequenced wrong —</text>
  <text x="96" y="696" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">latency breaks ordering assumptions.</text>
  <line x1="96" y1="726" x2="460" y2="726" stroke="#2D5BFF" stroke-width="1" stroke-opacity="0.25"/>
  <text x="96" y="750" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Failure mode two: simulate timing drift.</text>

  <!-- TILE 04 — bottom-right -->
  <rect x="520" y="524" width="440" height="272" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="590" font-size="54" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="552" y="640" font-size="21" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Schema Drift</text>
  <text x="552" y="676" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Upstream systems change without</text>
  <text x="552" y="696" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">warning. Silent failures follow.</text>
  <line x1="552" y1="726" x2="916" y2="726" stroke="#2D5BFF" stroke-width="1" stroke-opacity="0.25"/>
  <text x="552" y="750" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Failure mode three: test schema breaks.</text>

  <!-- ═══════════════════════════════════════════
       BOTTOM BAND  (y: 812 – 960)
  ════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="824" x2="960" y2="824" stroke="#111111" stroke-width="1" stroke-opacity="0.12"/>

  <!-- Closing line -->
  <text
    x="512" y="886"
    font-size="20" font-weight="700"
    fill="#3A3A3A"
    text-anchor="middle"
    letter-spacing="-0.01em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The gap between notebook and production is a design problem.</text>

  <text
    x="512" y="916"
    font-size="16" font-weight="400"
    fill="#3A3A3A"
    text-anchor="middle"
    letter-spacing="0em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Fail loudly. Fail safely. Ship reliable systems.</text>

</svg>