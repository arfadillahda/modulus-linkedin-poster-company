<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TOP BAND (0–226px) -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Wordmark top-right -->
  <text
    x="960"
    y="44"
    text-anchor="end"
    font-size="13"
    font-weight="600"
    fill="#2D5BFF"
    letter-spacing="0.18em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker label -->
  <text
    x="64"
    y="86"
    text-anchor="start"
    font-size="11"
    font-weight="600"
    fill="#2D5BFF"
    letter-spacing="0.22em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">DIGITALIZATION</text>

  <!-- Display headline line 1 -->
  <text
    x="64"
    y="148"
    text-anchor="start"
    font-size="52"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Adoption stalls when you solve</text>

  <!-- Display headline line 2 -->
  <text
    x="64"
    y="207"
    text-anchor="start"
    font-size="52"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">the wrong problem.</text>

  <!-- Accent underline beneath headline -->
  <line x1="64" y1="218" x2="480" y2="218" stroke="#2D5BFF" stroke-width="2"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MIDDLE BAND — 4-tile 2×2 grid (238–820px) -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Grid geometry:
       outer padding 64px, gap 16px
       usable width: 1024 - 64 - 64 = 896px
       2 columns: (896 - 16) / 2 = 440px each
       row 1 top: 242, height 270px
       row 2 top: 242 + 270 + 16 = 528, height 270px
  -->

  <!-- TILE 01 — top-left -->
  <rect x="64" y="242" width="440" height="270" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="302" font-size="56" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="92" y="346" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Technology ≠ Workflow</text>
  <text x="92" y="380" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The tool ships; the actual process never</text>
  <text x="92" y="400" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">changes.</text>

  <!-- TILE 02 — top-right -->
  <rect x="520" y="242" width="440" height="270" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="302" font-size="56" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="548" y="346" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Observe the Real Workflow</text>
  <text x="548" y="380" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Watch operators under load, not the</text>
  <text x="548" y="400" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">org-chart version.</text>

  <!-- TILE 03 — bottom-left -->
  <rect x="64" y="528" width="440" height="270" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="588" font-size="56" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="92" y="632" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Find the Friction Point</text>
  <text x="92" y="666" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Name what costs time or creates</text>
  <text x="92" y="686" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">rework before designing anything.</text>

  <!-- TILE 04 — bottom-right -->
  <rect x="520" y="528" width="440" height="270" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="588" font-size="56" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="548" y="632" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Remove Friction, Not Add Features</text>
  <text x="548" y="666" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The intervention saves someone's day;</text>
  <text x="548" y="686" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">that's what makes it stick.</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- BOTTOM BAND (820–1024px) -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="844" x2="960" y2="844" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text
    x="512"
    y="916"
    text-anchor="middle"
    font-size="22"
    font-weight="400"
    fill="#3A3A3A"
    letter-spacing="-0.01em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sticky adoption means solving a problem operators already feel.</text>

</svg>