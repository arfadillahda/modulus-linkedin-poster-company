<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <clipPath id="canvas-clip">
      <rect width="1024" height="1024"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ─── TOP BAND (0–225px) ─── -->

  <!-- Kicker label -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#C24A1F" letter-spacing="0.18em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">DIGITALIZATION</text>

  <!-- Display headline -->
  <text x="64" y="148" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Pilots work. Scaling them</text>
  <text x="64" y="200" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">is a different problem.</text>

  <!-- Accent underline under headline -->
  <rect x="64" y="212" width="180" height="2" fill="#C24A1F"/>

  <!-- Wordmark top-right -->
  <text x="960" y="76" font-size="12" font-weight="600" fill="#C24A1F" letter-spacing="0.18em" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- ─── MIDDLE BAND: 2×2 grid of tiles (y=240 to y=820) ─── -->
  <!-- Outer grid area: x=64, y=248, width=896, height=544 -->
  <!-- Two rows, two cols. gap=16. tile w=(896-16)/2=440. tile h=(544-16)/2=264 -->

  <!-- TILE 01 — top-left (x=64, y=248) -->
  <rect x="64" y="248" width="440" height="264" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="300" font-size="44" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="88" y="342" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Pilots succeed artificially</text>
  <text x="88" y="374" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Small scope, dedicated staff,</text>
  <text x="88" y="394" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">no real production pressure.</text>

  <!-- TILE 02 — top-right (x=520, y=248) -->
  <rect x="520" y="248" width="440" height="264" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="300" font-size="44" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="544" y="342" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Scale breaks operationally</text>
  <text x="544" y="374" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Ten sites, rotating staff, support</text>
  <text x="544" y="394" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">lag — nobody owns the system.</text>

  <!-- TILE 03 — bottom-left (x=64, y=528) -->
  <rect x="64" y="528" width="440" height="264" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="580" font-size="44" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="88" y="622" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Ask for the failure mode</text>
  <text x="88" y="654" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators name the breakdown</text>
  <text x="88" y="674" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">the system must prevent.</text>

  <!-- TILE 04 — bottom-right (x=520, y=528) -->
  <rect x="520" y="528" width="440" height="264" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="580" font-size="44" font-weight="800" fill="#C24A1F" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="544" y="622" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Stake it on a real cost</text>
  <text x="544" y="654" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">"Prevents a $50k mistake" gives</text>
  <text x="544" y="674" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">the system a built-in stakeholder.</text>

  <!-- ─── BOTTOM BAND ─── -->

  <!-- Hairline rule -->
  <line x1="64" y1="836" x2="960" y2="836" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="890" font-size="19" font-weight="400" fill="#3A3A3A" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Digitalization scales when it solves a problem operators already know.</text>

</svg>