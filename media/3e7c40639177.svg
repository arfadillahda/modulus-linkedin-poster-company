<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- TOP BAND (~22% = 225px) -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- MODULUS1 wordmark top-right -->
  <text
    x="960"
    y="78"
    text-anchor="end"
    font-size="13"
    font-weight="600"
    fill="#2D5BFF"
    letter-spacing="0.18em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker label -->
  <text
    x="64"
    y="78"
    font-size="11"
    font-weight="600"
    fill="#2D5BFF"
    letter-spacing="0.22em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI</text>

  <!-- Display headline -->
  <text
    x="64"
    y="132"
    font-size="52"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.025em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Optimising the Wrong</text>
  <text
    x="64"
    y="192"
    font-size="52"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.025em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Metric Kills Adoption</text>

  <!-- Accent underline beneath headline -->
  <line x1="64" y1="204" x2="480" y2="204" stroke="#2D5BFF" stroke-width="2"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MIDDLE BAND: 4 tiles in 2×2 grid                       -->
  <!-- Grid starts y=232, ends ~y=860                         -->
  <!-- Outer pad 64px, gap 16px                               -->
  <!-- tile w = (1024 - 64 - 64 - 16) / 2 = 440              -->
  <!-- tile h = (860 - 232 - 16) / 2 = 306                   -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- TILE 01 — top-left  x=64, y=232 -->
  <rect x="64" y="232" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="292" font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="92" y="338" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Wrong Training Data</text>
  <text x="92" y="370" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Historical data mismatches</text>
  <text x="92" y="390" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">what operators actually encounter.</text>

  <!-- TILE 02 — top-right  x=520, y=232 -->
  <rect x="520" y="232" width="440" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="292" font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="548" y="338" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Friction Defeats Accuracy</text>
  <text x="548" y="370" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Aggressive flagging means users</text>
  <text x="548" y="390" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">override the model every time.</text>

  <!-- TILE 03 — bottom-left  x=64, y=544 -->
  <rect x="64" y="544" width="440" height="296" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="604" font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="92" y="650" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Two Different Worlds</text>
  <text x="92" y="682" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Data scientists optimise for stats;</text>
  <text x="92" y="702" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">operators optimise for workflow.</text>

  <!-- TILE 04 — bottom-right  x=520, y=544 -->
  <rect x="520" y="544" width="440" height="296" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="604" font-size="48" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="548" y="650" font-size="20" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Watch the Job First</text>
  <text x="548" y="682" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Front-load operator input before</text>
  <text x="548" y="702" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">touching a training pipeline.</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- BOTTOM BAND (~16% = y=860 → 1024) -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="872" x2="960" y2="872" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text
    x="512"
    y="944"
    text-anchor="middle"
    font-size="22"
    font-weight="700"
    fill="#3A3A3A"
    letter-spacing="-0.01em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Adoption on day one means everything.</text>

</svg>