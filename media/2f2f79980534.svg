<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->
  <!-- Kicker label -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="start" font-variant="small-caps">DIGITALIZATION</text>

  <!-- Wordmark top-right -->
  <text x="960" y="96" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- Display headline -->
  <text x="64" y="148" font-size="48" font-weight="800" fill="#111111" letter-spacing="-0.02em" text-anchor="start">
    <tspan x="64" dy="0">Pilots prove the demo,</tspan>
    <tspan x="64" dy="58">not the operation.</tspan>
  </text>

  <!-- Accent underline under headline -->
  <rect x="64" y="214" width="120" height="3" rx="1.5" fill="#2D5BFF"/>

  <!-- MIDDLE BAND — 4 tiles in 2×2 grid -->
  <!-- Tile dimensions: two columns, two rows -->
  <!-- Column 1: x=64, Column 2: x=64+448+16=528 -->
  <!-- Tile width: (1024 - 64 - 64 - 16) / 2 = 440 -->
  <!-- Row 1: y=248, Row 2: y=248+220+16=484 -->
  <!-- Tile height: 210 -->

  <!-- Tile 01 -->
  <rect x="64" y="248" width="440" height="210" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="300" font-size="36" font-weight="800" fill="#2D5BFF" letter-spacing="-0.01em">01</text>
  <text x="92" y="334" font-size="18" font-weight="700" fill="#111111">Demo-First Failure</text>
  <text x="92" y="362" font-size="14" font-weight="400" fill="#3A3A3A">Pilots optimize for readability, not production reality.</text>
  <!-- decorative hairline -->
  <line x1="92" y1="382" x2="460" y2="382" stroke="#11111114" stroke-width="1"/>
  <text x="92" y="404" font-size="12" font-weight="400" fill="#3A3A3A" font-style="italic">Clean data. Stable networks. Willing users.</text>

  <!-- Tile 02 -->
  <rect x="520" y="248" width="440" height="210" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="300" font-size="36" font-weight="800" fill="#2D5BFF" letter-spacing="-0.01em">02</text>
  <text x="548" y="334" font-size="18" font-weight="700" fill="#111111">The Integration Gap</text>
  <text x="548" y="362" font-size="14" font-weight="400" fill="#3A3A3A">Systems stall when ERP, data, and ops don't connect.</text>
  <line x1="548" y1="382" x2="916" y2="382" stroke="#11111114" stroke-width="1"/>
  <text x="548" y="404" font-size="12" font-weight="400" fill="#3A3A3A" font-style="italic">Unused software. Manual workarounds. Broken handoffs.</text>

  <!-- Tile 03 -->
  <rect x="64" y="474" width="440" height="210" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="526" font-size="36" font-weight="800" fill="#2D5BFF" letter-spacing="-0.01em">03</text>
  <text x="92" y="560" font-size="18" font-weight="700" fill="#111111">Real Operator Constraints</text>
  <text x="92" y="588" font-size="14" font-weight="400" fill="#3A3A3A">Offline work, data gaps, graceful failure — non-negotiable.</text>
  <line x1="92" y1="608" x2="460" y2="608" stroke="#11111114" stroke-width="1"/>
  <text x="92" y="630" font-size="12" font-weight="400" fill="#3A3A3A" font-style="italic">Production never matches the pilot bench.</text>

  <!-- Tile 04 -->
  <rect x="520" y="474" width="440" height="210" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="526" font-size="36" font-weight="800" fill="#2D5BFF" letter-spacing="-0.01em">04</text>
  <text x="548" y="560" font-size="18" font-weight="700" fill="#111111">Integrate From Day One</text>
  <text x="548" y="588" font-size="14" font-weight="400" fill="#3A3A3A">Map hard constraints before writing a line of code.</text>
  <line x1="548" y1="608" x2="916" y2="608" stroke="#11111114" stroke-width="1"/>
  <text x="548" y="630" font-size="12" font-weight="400" fill="#3A3A3A" font-style="italic">Connectivity. Data quality. Handoff delays.</text>

  <!-- BOTTOM BAND -->
  <!-- Hairline rule -->
  <line x1="64" y1="730" x2="960" y2="730" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="800" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em">A pilot that can't scale was never a proof of concept.</text>

  <!-- Secondary closing sub-note -->
  <text x="512" y="836" font-size="13" font-weight="400" fill="#3A3A3A" text-anchor="middle" letter-spacing="0.01em">Build for reality. Not the bench.</text>

  <!-- Bottom wordmark / page indicator -->
  <text x="512" y="940" font-size="11" font-weight="600" fill="#2D5BFF" text-anchor="middle" letter-spacing="0.18em">MODULUS1</text>
  <line x1="412" y1="952" x2="612" y2="952" stroke="#2D5BFF" stroke-width="1" opacity="0.3"/>

</svg>