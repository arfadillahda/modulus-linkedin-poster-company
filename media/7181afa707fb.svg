<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════
       TOP BAND (~0–225px)
  ═══════════════════════════════════════════════ -->

  <!-- MODULUS1 wordmark top-right -->
  <text
    x="960"
    y="78"
    text-anchor="end"
    font-size="13"
    font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.18em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker -->
  <text
    x="64"
    y="80"
    font-size="11.5"
    font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.22em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">SUSTAINABILITY</text>

  <!-- Display Headline line 1 -->
  <text
    x="64"
    y="138"
    font-size="54"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Targets that ops can't</text>

  <!-- Display Headline line 2 -->
  <text
    x="64"
    y="196"
    font-size="54"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">actually measure</text>

  <!-- Accent underline beneath headline -->
  <rect x="64" y="208" width="340" height="3" rx="1.5" fill="#1F5C3D"/>

  <!-- ═══════════════════════════════════════════════
       MIDDLE BAND: 2×2 + 1 bottom = 5 tiles
       Top row: 2 tall tiles (y=240, height=310)
       Bottom row: 3 short tiles (y=566, height=210)
       Outer padding 64px, gap 16px
       Canvas width available: 1024 - 128 = 896
       Top row: each tile = (896-16)/2 = 440
       Bottom row: each tile = (896-32)/3 = 288
  ═══════════════════════════════════════════════ -->

  <!-- ─── TILE 01 (top-left) ─── -->
  <rect x="64" y="240" width="440" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="302" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="92" y="350" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Measurement Gap</text>
  <text x="92" y="388" font-size="15.5" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">No sensors. No data. Baselines were</text>
  <text x="92" y="408" font-size="15.5" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">often guessed, not measured.</text>

  <!-- ─── TILE 02 (top-right) ─── -->
  <rect x="520" y="240" width="440" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="302" font-size="52" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="548" y="350" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Two Info Universes</text>
  <text x="548" y="388" font-size="15.5" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Annual reports vs. shift logs —</text>
  <text x="548" y="408" font-size="15.5" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">sustainability and ops don't overlap.</text>

  <!-- ─── TILE 03 (bottom-left) ─── -->
  <rect x="64" y="566" width="288" height="210" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="90" y="622" font-size="44" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="90" y="660" font-size="19" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Start With</text>
  <text x="90" y="682" font-size="19" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">What Exists</text>
  <text x="90" y="714" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Map what operators already</text>
  <text x="90" y="732" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">track — not what they should.</text>

  <!-- ─── TILE 04 (bottom-center) ─── -->
  <rect x="368" y="566" width="288" height="210" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="394" y="622" font-size="44" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="394" y="660" font-size="19" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Run a</text>
  <text x="394" y="682" font-size="19" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Two-Day Audit</text>
  <text x="394" y="714" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Sit with equipment operators.</text>
  <text x="394" y="732" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">List every number they track.</text>

  <!-- ─── TILE 05 (bottom-right) ─── -->
  <rect x="672" y="566" width="288" height="210" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="698" y="622" font-size="44" font-weight="800" fill="#1F5C3D" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">05</text>
  <text x="698" y="660" font-size="19" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Build Inside</text>
  <text x="698" y="682" font-size="19" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Observable Reality</text>
  <text x="698" y="714" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Lose some precision early.</text>
  <text x="698" y="732" font-size="14" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Gain targets that survive handoff.</text>

  <!-- ═══════════════════════════════════════════════
       BOTTOM BAND (~800–1024px)
  ═══════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="820" x2="960" y2="820" stroke="#11111128" stroke-width="1"/>

  <!-- Closing line -->
  <text
    x="512"
    y="893"
    text-anchor="middle"
    font-size="24"
    font-weight="400"
    fill="#3A3A3A"
    letter-spacing="-0.01em"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Target your emissions to data operators already own.</text>

</svg>