<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- TOP BAND -->
  <!-- Kicker -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="start" font-variant="small-caps">AI</text>

  <!-- Display Headline -->
  <text x="64" y="138" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em">
    <tspan x="64" dy="0">Accuracy Doesn't Mean</tspan>
    <tspan x="64" dy="54">Operators Will Trust It</tspan>
  </text>

  <!-- Accent underline under headline -->
  <line x1="64" y1="202" x2="320" y2="202" stroke="#2D5BFF" stroke-width="2"/>

  <!-- Wordmark top-right -->
  <text x="960" y="76" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- MIDDLE BAND — 4 tiles in 2x2 grid -->
  <!-- Grid: left col x=64, right col x=548, top row y=230, bottom row y=572 -->
  <!-- Tile width = 448, tile height = 318, gap=16 -->

  <!-- TILE 01 -->
  <rect x="64" y="230" width="448" height="318" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="290" font-size="48" font-weight="800" fill="#2D5BFF">01</text>
  <text x="92" y="334" font-size="20" font-weight="700" fill="#111111">The Lab–Field Gap</text>
  <text x="92" y="366" font-size="15" font-weight="400" fill="#3A3A3A">Accuracy is measurable. Operator trust is not.</text>
  <!-- Small decorative rule -->
  <line x1="92" y1="388" x2="200" y2="388" stroke="#2D5BFF" stroke-width="1" opacity="0.4"/>

  <!-- TILE 02 -->
  <rect x="528" y="230" width="432" height="318" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="556" y="290" font-size="48" font-weight="800" fill="#2D5BFF">02</text>
  <text x="556" y="334" font-size="20" font-weight="700" fill="#111111">The Wrong Metric</text>
  <text x="556" y="366" font-size="15" font-weight="400" fill="#3A3A3A">ROC curves don't capture "can I act on this?"</text>
  <line x1="556" y1="388" x2="664" y2="388" stroke="#2D5BFF" stroke-width="1" opacity="0.4"/>

  <!-- TILE 03 -->
  <rect x="64" y="564" width="448" height="318" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="624" font-size="48" font-weight="800" fill="#2D5BFF">03</text>
  <text x="92" y="668" font-size="20" font-weight="700" fill="#111111">Cognitive Load > Accuracy</text>
  <text x="92" y="700" font-size="15" font-weight="400" fill="#3A3A3A">Does this make decisions faster or more confident?</text>
  <line x1="92" y1="722" x2="200" y2="722" stroke="#2D5BFF" stroke-width="1" opacity="0.4"/>

  <!-- TILE 04 -->
  <rect x="528" y="564" width="432" height="318" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="556" y="624" font-size="48" font-weight="800" fill="#2D5BFF">04</text>
  <text x="556" y="668" font-size="20" font-weight="700" fill="#111111">Design for Legibility</text>
  <text x="556" y="700" font-size="15" font-weight="400" fill="#3A3A3A">Surface uncertainty. Make reasoning visible.</text>
  <line x1="556" y1="722" x2="664" y2="722" stroke="#2D5BFF" stroke-width="1" opacity="0.4"/>

  <!-- BOTTOM BAND -->
  <line x1="64" y1="910" x2="960" y2="910" stroke="#11111118" stroke-width="1"/>
  <text x="512" y="952" font-size="18" font-weight="400" fill="#3A3A3A" text-anchor="middle" letter-spacing="0.01em">AI adoption isn't a model problem — it's a trust problem.</text>

</svg>