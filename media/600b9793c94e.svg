<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ===================== TOP BAND ===================== -->

  <!-- Kicker label -->
  <text x="64" y="88" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="start" font-variant="normal" text-transform="uppercase">DIGITALIZATION</text>

  <!-- Accent underline under headline -->
  <line x1="64" y1="152" x2="200" y2="152" stroke="#2D5BFF" stroke-width="2"/>

  <!-- Display headline line 1 -->
  <text x="64" y="134" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em">Stop measuring connectivity.</text>
  <!-- Display headline line 2 -->
  <text x="64" y="188" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em">Measure decisions.</text>

  <!-- MODULUS1 wordmark top-right -->
  <text x="960" y="72" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- ===================== MIDDLE BAND — 2x2 GRID ===================== -->
  <!-- Grid origin: x=64, y=224. Total width=896, height~530 -->
  <!-- 4 tiles in 2x2: tile w=(896-16)/2=440, tile h=250 -->
  <!-- Gap=16px -->

  <!-- TILE 01 — top-left: x=64, y=224 -->
  <rect x="64" y="224" width="440" height="250" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="278" font-size="52" font-weight="800" fill="#2D5BFF">01</text>
  <text x="88" y="316" font-size="20" font-weight="700" fill="#111111">The Wrong Metric</text>
  <text x="88" y="344" font-size="14" font-weight="400" fill="#3A3A3A">'All systems connected' is not</text>
  <text x="88" y="362" font-size="14" font-weight="400" fill="#3A3A3A">operational success.</text>

  <!-- TILE 02 — top-right: x=520, y=224 -->
  <rect x="520" y="224" width="440" height="250" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="278" font-size="52" font-weight="800" fill="#2D5BFF">02</text>
  <text x="544" y="316" font-size="20" font-weight="700" fill="#111111">Top-Down Blind Spot</text>
  <text x="544" y="344" font-size="14" font-weight="400" fill="#3A3A3A">Finance, IT, and compliance optimize</text>
  <text x="544" y="362" font-size="14" font-weight="400" fill="#3A3A3A">for accountability, not operators.</text>

  <!-- TILE 03 — bottom-left: x=64, y=490 -->
  <rect x="64" y="490" width="440" height="250" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="544" font-size="52" font-weight="800" fill="#2D5BFF">03</text>
  <text x="88" y="582" font-size="20" font-weight="700" fill="#111111">The Trust Gap</text>
  <text x="88" y="610" font-size="14" font-weight="400" fill="#3A3A3A">Operators build workarounds when</text>
  <text x="88" y="628" font-size="14" font-weight="400" fill="#3A3A3A">digital data conflicts with reality.</text>

  <!-- TILE 04 — bottom-right: x=520, y=490 -->
  <rect x="520" y="490" width="440" height="250" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="544" font-size="52" font-weight="800" fill="#2D5BFF">04</text>
  <text x="544" y="582" font-size="20" font-weight="700" fill="#111111">The Right Measure</text>
  <text x="544" y="610" font-size="14" font-weight="400" fill="#3A3A3A">Does it shorten feedback between</text>
  <text x="544" y="628" font-size="14" font-weight="400" fill="#3A3A3A">action and consequence? That's it.</text>

  <!-- ===================== BOTTOM BAND ===================== -->

  <!-- Hairline rule -->
  <line x1="64" y1="786" x2="960" y2="786" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="832" font-size="18" font-weight="400" fill="#3A3A3A" text-anchor="middle" letter-spacing="0.01em">Make the next decision faster and more certain than the last.</text>

</svg>