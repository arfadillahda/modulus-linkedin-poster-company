<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- Top Band -->
  <!-- Kicker -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="start" font-variant="small-caps">SUSTAINABILITY</text>

  <!-- Headline -->
  <text x="64" y="140" font-size="42" font-weight="800" fill="#111111" letter-spacing="-0.02em" text-anchor="start">
    <tspan x="64" dy="0">Your Scope 3 dashboard</tspan>
    <tspan x="64" dy="50">is already out of date</tspan>
  </text>

  <!-- Accent underline under headline -->
  <rect x="64" y="197" width="180" height="2.5" rx="1" fill="#1F5C3D"/>

  <!-- Wordmark top-right -->
  <text x="960" y="60" font-size="12" font-weight="600" fill="#1F5C3D" letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- ================================================ -->
  <!-- Middle Band: 2x2 grid of 4 tiles -->
  <!-- Grid starts at y=232, outer padding 64px -->
  <!-- Two columns: col1 x=64, col2 x=64+448+16=528 -->
  <!-- Tile width = (1024 - 64*2 - 16) / 2 = 440 -->
  <!-- Two rows: row1 y=232, row2 y=232+200+16=448 -->
  <!-- Tile height = 190 -->

  <!-- Tile 01 -->
  <rect x="64" y="232" width="440" height="190" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="276" font-size="36" font-weight="800" fill="#1F5C3D">01</text>
  <text x="88" y="308" font-size="17" font-weight="700" fill="#111111">Static Data Import</text>
  <text x="88" y="334" font-size="13" font-weight="400" fill="#3A3A3A">Suppliers declared once, never reverified</text>
  <text x="88" y="354" font-size="13" font-weight="400" fill="#3A3A3A">as contracts and routes shift constantly.</text>

  <!-- Tile 02 -->
  <rect x="520" y="232" width="440" height="190" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="276" font-size="36" font-weight="800" fill="#1F5C3D">02</text>
  <text x="544" y="308" font-size="17" font-weight="700" fill="#111111">Lagging Snapshots</text>
  <text x="544" y="334" font-size="13" font-weight="400" fill="#3A3A3A">Vendor switches faster than dashboards</text>
  <text x="544" y="354" font-size="13" font-weight="400" fill="#3A3A3A">update — the metric becomes fiction.</text>

  <!-- Tile 03 -->
  <rect x="64" y="438" width="440" height="190" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="482" font-size="36" font-weight="800" fill="#1F5C3D">03</text>
  <text x="88" y="514" font-size="17" font-weight="700" fill="#111111">Claims as Hypotheses</text>
  <text x="88" y="540" font-size="13" font-weight="400" fill="#3A3A3A">Treat supplier emissions data as unproven</text>
  <text x="88" y="560" font-size="13" font-weight="400" fill="#3A3A3A">until cross-checked against operations.</text>

  <!-- Tile 04 -->
  <rect x="520" y="438" width="440" height="190" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="482" font-size="36" font-weight="800" fill="#1F5C3D">04</text>
  <text x="544" y="514" font-size="17" font-weight="700" fill="#111111">Continuous Verification</text>
  <text x="544" y="540" font-size="13" font-weight="400" fill="#3A3A3A">Schema-validated pipelines flag when</text>
  <text x="544" y="560" font-size="13" font-weight="400" fill="#3A3A3A">reported story stops matching reality.</text>

  <!-- ================================================ -->
  <!-- Bottom Band -->
  <!-- Hairline rule -->
  <line x1="64" y1="672" x2="960" y2="672" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="722" font-size="19" font-weight="700" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em">Scope 3 is a continuous verification problem, not a calculation.</text>

</svg>