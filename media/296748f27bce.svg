<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ── TOP BAND ── -->

  <!-- Wordmark top-right -->
  <text x="960" y="42" text-anchor="end" font-size="13" font-weight="600" fill="#2D5BFF" letter-spacing="3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Kicker -->
  <text x="64" y="80" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="3.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI</text>

  <!-- Display headline line 1 -->
  <text x="64" y="136" font-size="52" font-weight="800" fill="#111111" letter-spacing="-1.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Schema Drift Kills</text>

  <!-- Display headline line 2 -->
  <text x="64" y="196" font-size="52" font-weight="800" fill="#111111" letter-spacing="-1.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Models After Launch</text>

  <!-- Accent underline under headline -->
  <rect x="64" y="210" width="260" height="3" rx="1.5" fill="#2D5BFF"/>

  <!-- ── MIDDLE BAND — 2×2 grid of 4 tiles ── -->

  <!-- Tile gap=18, outer pad=64, canvas=1024, two cols -->
  <!-- col width = (1024 - 64 - 64 - 18) / 2 = (896 - 18)/2 = 439 -->
  <!-- row height = (1024*0.62 - 18) / 2 ≈ (634 - 18)/2 = 308 -->
  <!-- top of grid: 240, bottom of grid: ~858 -->

  <!-- TILE 01 — top-left: x=64, y=240, w=439, h=296 -->
  <rect x="64" y="240" width="439" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="308" font-size="72" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <text x="92" y="358" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The Gap Is Real</text>
  <text x="92" y="392" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">94% in testing. 67% in production.</text>
  <text x="92" y="412" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">That collapse is schema drift.</text>

  <!-- TILE 02 — top-right: x=521, y=240, w=439, h=296 -->
  <rect x="521" y="240" width="439" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="549" y="308" font-size="72" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="549" y="358" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Malformed at Ingestion</text>
  <text x="549" y="392" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Live data arrives missing fields,</text>
  <text x="549" y="412" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">broken enums, mismatched timestamps.</text>

  <!-- TILE 03 — bottom-left: x=64, y=554, w=439, h=296 -->
  <rect x="64" y="554" width="439" height="296" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="622" font-size="72" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="92" y="672" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Silent, Compounding Failure</text>
  <text x="92" y="706" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The model doesn't crash —</text>
  <text x="92" y="726" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">it predicts garbage, quietly.</text>

  <!-- TILE 04 — bottom-right: x=521, y=554, w=439, h=296 -->
  <rect x="521" y="554" width="439" height="296" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="549" y="622" font-size="72" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="549" y="672" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Validate Every Iteration</text>
  <text x="549" y="706" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Bake schema checks into training.</text>
  <text x="549" y="726" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Log violations as world-assumption signals.</text>

  <!-- ── BOTTOM BAND ── -->

  <!-- Hairline rule -->
  <line x1="64" y1="876" x2="960" y2="876" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="930" text-anchor="middle" font-size="22" font-weight="700" fill="#3A3A3A" letter-spacing="-0.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Schema discipline separates a demo from a system that ships.</text>

</svg>