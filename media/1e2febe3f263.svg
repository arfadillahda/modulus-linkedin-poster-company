<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- Top band accent underline -->
  <rect x="64" y="198" width="60" height="2" fill="#2D5BFF"/>

  <!-- KICKER -->
  <text x="64" y="88" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">DIGITALIZATION</text>

  <!-- WORDMARK top-right -->
  <text x="960" y="88" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- HEADLINE -->
  <text x="64" y="138" font-size="44" font-weight="800" fill="#111111" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <tspan x="64" dy="0">Operators won't trust systems</tspan>
    <tspan x="64" dy="52">they can't verify.</tspan>
  </text>

  <!-- ============================================================ -->
  <!-- TILE GRID: 2x2 = 4 tiles                                     -->
  <!-- Outer padding 64px. Gap 16px. Middle band y: ~226 to 860     -->
  <!-- Tile area: y=226, height=618. Two rows: each ~301px tall.    -->
  <!-- Two cols: each (1024-128-16)/2 = 440px wide                  -->
  <!-- Col1 x=64, Col2 x=64+440+16=520                              -->
  <!-- Row1 y=226, Row2 y=226+301+16=543                            -->
  <!-- ============================================================ -->

  <!-- TILE 01 — Col1 Row1 -->
  <rect x="64" y="226" width="440" height="301" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="92" y="293" font-size="52" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <!-- Title -->
  <text x="92" y="340" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Isolated entry forms</text>
  <!-- Caption -->
  <text x="92" y="374" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">No schema contract links form to backend logic.</text>
  <!-- Divider line -->
  <line x1="92" y1="400" x2="474" y2="400" stroke="#11111120" stroke-width="1"/>
  <!-- Sub-note -->
  <text x="92" y="426" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators can't know if data will be accepted.</text>
  <!-- Tile tag -->
  <text x="92" y="498" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.12em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">CAUSE</text>

  <!-- TILE 02 — Col2 Row1 -->
  <rect x="520" y="226" width="440" height="301" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="293" font-size="52" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="548" y="340" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Trust collapses first</text>
  <text x="548" y="374" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Doubt about acceptance drives reversion to paper.</text>
  <line x1="548" y1="400" x2="930" y2="400" stroke="#11111120" stroke-width="1"/>
  <text x="548" y="426" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The digital chain breaks when confidence breaks.</text>
  <text x="548" y="498" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.12em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">EFFECT</text>

  <!-- TILE 03 — Col1 Row2 -->
  <rect x="64" y="543" width="440" height="301" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="610" font-size="52" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="92" y="657" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">No live feedback loop</text>
  <text x="92" y="691" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Rejection arrives after submit, not before it.</text>
  <line x1="92" y1="717" x2="474" y2="717" stroke="#11111120" stroke-width="1"/>
  <text x="92" y="743" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators have no signal while typing.</text>
  <text x="92" y="815" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.12em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MECHANISM</text>

  <!-- TILE 04 — Col2 Row2 -->
  <rect x="520" y="543" width="440" height="301" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="548" y="610" font-size="52" font-weight="800" fill="#2D5BFF" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="548" y="657" font-size="22" font-weight="700" fill="#111111" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Validate at the edge</text>
  <text x="548" y="691" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Enforce backend rules in real time at entry.</text>
  <line x1="548" y1="717" x2="930" y2="717" stroke="#11111120" stroke-width="1"/>
  <text x="548" y="743" font-size="13" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Clear reasons rebuild trust before submit.</text>
  <text x="548" y="815" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.12em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">FIX</text>

  <!-- ============================================================ -->
  <!-- BOTTOM BAND                                                   -->
  <!-- ============================================================ -->

  <!-- Hairline rule -->
  <line x1="64" y1="878" x2="960" y2="878" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="920" font-size="17" font-weight="400" fill="#3A3A3A" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Validation at the edge is the entry price for digital adoption.</text>

</svg>