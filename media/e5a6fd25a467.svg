<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TOP BAND (~22% = 225px) -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- MODULUS1 wordmark top-right -->
  <text
    x="960"
    y="84"
    text-anchor="end"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.18em">MODULUS1</text>

  <!-- Kicker -->
  <text
    x="64"
    y="84"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="600"
    fill="#1F5C3D"
    letter-spacing="0.22em">SUSTAINABILITY</text>

  <!-- Display headline -->
  <text
    x="64"
    y="142"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em">Carbon Numbers You Can't</text>
  <text
    x="64"
    y="200"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="52"
    font-weight="800"
    fill="#111111"
    letter-spacing="-0.02em">Trust Are Useless</text>

  <!-- Accent underline under headline -->
  <rect x="64" y="213" width="220" height="3" rx="1.5" fill="#1F5C3D"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MIDDLE BAND: 4 tiles in 2×2 grid                         -->
  <!-- Starts at y=245, height ≈ 636px                           -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Grid math:
       outer padding = 64px each side
       usable width = 1024 - 128 = 896px
       gap = 16px, 2 cols → tile width = (896 - 16) / 2 = 440px
       tile height = (636 - 16) / 2 = 310px
       row1 top = 245, row2 top = 245 + 310 + 16 = 571
  -->

  <!-- TILE 01 — top-left -->
  <rect x="64" y="245" width="440" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="302"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="42" font-weight="800" fill="#1F5C3D">01</text>
  <text x="96" y="346"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Black Box KPIs</text>
  <text x="96" y="376"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">Software aggregates reported metrics,</text>
  <text x="96" y="397"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">never the conditions behind them.</text>

  <!-- TILE 02 — top-right -->
  <rect x="520" y="245" width="440" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="302"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="42" font-weight="800" fill="#1F5C3D">02</text>
  <text x="552" y="346"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">The Dust Storm Test</text>
  <text x="552" y="376"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">A shutdown cut emissions. The model</text>
  <text x="552" y="397"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">claimed credit for it anyway.</text>

  <!-- TILE 03 — bottom-left -->
  <rect x="64" y="571" width="440" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="96" y="628"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="42" font-weight="800" fill="#1F5C3D">03</text>
  <text x="96" y="672"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Trusted Inputs, Broken</text>
  <text x="96" y="700"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Assumptions</text>
  <text x="96" y="734"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">Models run on reported data,</text>
  <text x="96" y="755"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">not observed operational state.</text>

  <!-- TILE 04 — bottom-right -->
  <rect x="520" y="571" width="440" height="310" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="628"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="42" font-weight="800" fill="#1F5C3D">04</text>
  <text x="552" y="672"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Validate Before You</text>
  <text x="552" y="700"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22" font-weight="700" fill="#111111">Ledger</text>
  <text x="552" y="734"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">Cross-check every metric against sensor</text>
  <text x="552" y="755"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="15" font-weight="400" fill="#3A3A3A">streams and plant logs in real time.</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- BOTTOM BAND (~16% = ~164px, starting at ~860)             -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="900" x2="960" y2="900" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text
    x="512"
    y="958"
    text-anchor="middle"
    font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="400"
    fill="#3A3A3A"
    letter-spacing="-0.01em">You can't improve what you're not honestly measuring.</text>

</svg>