<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- Top Band -->
  <!-- Kicker -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#C24A1F" letter-spacing="0.18em" text-anchor="start" font-variant="small-caps">DIGITALIZATION</text>

  <!-- Wordmark top-right -->
  <text x="960" y="96" font-size="12" font-weight="600" fill="#C24A1F" letter-spacing="0.18em" text-anchor="end">MODULUS1</text>

  <!-- Display headline -->
  <text x="64" y="148" font-size="46" font-weight="800" fill="#111111" letter-spacing="-0.02em" text-anchor="start">
    <tspan x="64" dy="0">Build for the operator's</tspan>
    <tspan x="64" dy="54">decision, not the dashboard.</tspan>
  </text>

  <!-- Accent underline under headline -->
  <rect x="64" y="214" width="180" height="3" rx="1.5" fill="#C24A1F"/>

  <!-- Middle Band: 2x2 grid of 4 tiles -->
  <!-- Tile layout: top-left, top-right, bottom-left, bottom-right -->
  <!-- Grid: x=64, y=240, tile w=436, tile h=320, gap=16 -->

  <!-- Tile 01 -->
  <rect x="64" y="236" width="436" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="292" font-size="48" font-weight="800" fill="#C24A1F" letter-spacing="-0.02em">01</text>
  <text x="92" y="334" font-size="20" font-weight="700" fill="#111111">The Gap Is Perceptual</text>
  <text x="92" y="366" font-size="15" font-weight="400" fill="#3A3A3A">
    <tspan x="92" dy="0">Vendors optimize accuracy.</tspan>
    <tspan x="92" dy="22">Operators optimize speed and fault tolerance.</tspan>
  </text>

  <!-- Tile 02 -->
  <rect x="524" y="236" width="436" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="292" font-size="48" font-weight="800" fill="#C24A1F" letter-spacing="-0.02em">02</text>
  <text x="552" y="334" font-size="20" font-weight="700" fill="#111111">Failure Modes First</text>
  <text x="552" y="366" font-size="15" font-weight="400" fill="#3A3A3A">
    <tspan x="552" dy="0">When a sensor drops, operators need</tspan>
    <tspan x="552" dy="22">trust signals — not confidence intervals.</tspan>
  </text>

  <!-- Tile 03 -->
  <rect x="64" y="562" width="436" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="92" y="618" font-size="48" font-weight="800" fill="#C24A1F" letter-spacing="-0.02em">03</text>
  <text x="92" y="660" font-size="20" font-weight="700" fill="#111111">Latency Is a Hard Constraint</text>
  <text x="92" y="692" font-size="15" font-weight="400" fill="#3A3A3A">
    <tspan x="92" dy="0">45-second forms lose to clipboards.</tspan>
    <tspan x="92" dy="22">Speed is a design contract, not a detail.</tspan>
  </text>

  <!-- Tile 04 -->
  <rect x="524" y="562" width="436" height="310" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="552" y="618" font-size="48" font-weight="800" fill="#C24A1F" letter-spacing="-0.02em">04</text>
  <text x="552" y="660" font-size="20" font-weight="700" fill="#111111">Design Backward From Operators</text>
  <text x="552" y="692" font-size="15" font-weight="400" fill="#3A3A3A">
    <tspan x="552" dy="0">One data model for both engineers and</tspan>
    <tspan x="552" dy="22">operators. Fault tolerance in the API layer.</tspan>
  </text>

  <!-- Bottom Band -->
  <!-- Hairline rule -->
  <line x1="64" y1="900" x2="960" y2="900" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="952" font-size="22" font-weight="700" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em">Software that fits the workflow is software that gets used.</text>

</svg>