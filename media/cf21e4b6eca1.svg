<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">

  <!-- Background -->
  <rect width="1024" height="1024" fill="#F5F1EA"/>

  <!-- ═══════════════════════════════════════════════
       TOP BAND (~22% = 225px)
  ═══════════════════════════════════════════════ -->

  <!-- Kicker label -->
  <text x="64" y="96" font-size="11" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">AI</text>

  <!-- Wordmark top-right -->
  <text x="960" y="96" font-size="12" font-weight="600" fill="#2D5BFF" letter-spacing="0.18em" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">MODULUS1</text>

  <!-- Display headline line 1 -->
  <text x="64" y="148" font-size="52" font-weight="800" fill="#111111" letter-spacing="-0.025em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Accurate Models,</text>
  <!-- Display headline line 2 -->
  <text x="64" y="208" font-size="52" font-weight="800" fill="#111111" letter-spacing="-0.025em" text-anchor="start" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Unused in Production</text>

  <!-- Accent underline rule under headline -->
  <line x1="64" y1="222" x2="340" y2="222" stroke="#2D5BFF" stroke-width="2.5"/>

  <!-- ═══════════════════════════════════════════════
       MIDDLE BAND: 4-tile 2×2 grid
       Starts y=248, ends y=248+590=838
       Outer padding: 64px sides
       Gap: 16px
       Two columns, two rows
       usable width: 1024 - 64 - 64 = 896px
       tile width: (896 - 16) / 2 = 440px
       usable height for 2 rows: 590px
       tile height: (590 - 16) / 2 = 287px
  ═══════════════════════════════════════════════ -->

  <!-- ── TILE 01 (row1, col1) x=64, y=248 ── -->
  <rect x="64" y="248" width="440" height="287" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <!-- Numeral -->
  <text x="88" y="308" font-size="44" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">01</text>
  <!-- Tile title -->
  <text x="88" y="352" font-size="20" font-weight="700" fill="#111111" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Metrics ≠ Usability</text>
  <!-- Caption -->
  <text x="88" y="382" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">89% accuracy doesn't guarantee operators will act.</text>
  <!-- Supporting line -->
  <text x="88" y="406" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Validation sets don't capture production noise.</text>

  <!-- ── TILE 02 (row1, col2) x=520, y=248 ── -->
  <rect x="520" y="248" width="440" height="287" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="308" font-size="44" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">02</text>
  <text x="544" y="352" font-size="20" font-weight="700" fill="#111111" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Operators Work Under Pressure</text>
  <text x="544" y="382" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Time pressure, incomplete context, 3 AM alerts.</text>
  <text x="544" y="406" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">A sound model can still be operationally unusable.</text>

  <!-- ── TILE 03 (row2, col1) x=64, y=551 ── -->
  <rect x="64" y="551" width="440" height="287" rx="16" fill="#FFFFFF" stroke="#11111118" stroke-width="1"/>
  <text x="88" y="611" font-size="44" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">03</text>
  <text x="88" y="655" font-size="20" font-weight="700" fill="#111111" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Run a Decision Audit First</text>
  <text x="88" y="685" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Shadow operators before touching model architecture.</text>
  <text x="88" y="709" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Map when and how they'd actually need to act.</text>

  <!-- ── TILE 04 (row2, col2) x=520, y=551 ── -->
  <rect x="520" y="551" width="440" height="287" rx="16" fill="#EFEAE0" stroke="#11111118" stroke-width="1"/>
  <text x="544" y="611" font-size="44" font-weight="800" fill="#2D5BFF" letter-spacing="-0.02em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">04</text>
  <text x="544" y="655" font-size="20" font-weight="700" fill="#111111" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Build a Decision Interface</text>
  <text x="544" y="685" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Wrap the model in rules a human can act on.</text>
  <text x="544" y="709" font-size="15" font-weight="400" fill="#3A3A3A" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">The model is one input, not a black-box output.</text>

  <!-- ═══════════════════════════════════════════════
       BOTTOM BAND (~16% = 164px, from y=860 to y=1024)
  ═══════════════════════════════════════════════ -->

  <!-- Hairline rule -->
  <line x1="64" y1="862" x2="960" y2="862" stroke="#11111130" stroke-width="1"/>

  <!-- Closing line -->
  <text x="512" y="940" font-size="22" font-weight="400" fill="#3A3A3A" text-anchor="middle" letter-spacing="-0.01em" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">Can your operator actually use it?</text>

</svg>